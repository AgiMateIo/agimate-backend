name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Signatures are stored as a commit on the `cla-signatures` branch, so this workflow needs
# write access — unlike the deploy workflow, which is read-only.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Never self-hosted. `pull_request_target` runs with a write token and fires on pull
    # requests from forks; the runner that has our deploy credentials must stay out of reach.
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/AgiMateIo/backend/blob/master/CLA.md'
          branch: 'cla-signatures'
          allowlist: easmith,dependabot[bot]
