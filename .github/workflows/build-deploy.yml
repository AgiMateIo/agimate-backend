name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'services/user-api/**'
      - 'services/mobile-api/**'
      - 'services/connectors-api/**'
      - 'services/libs/**'
      - 'services/build.gradle.kts'
      - 'services/settings.gradle.kts'

jobs:
  validate-config:
    runs-on: self-hosted
    steps:
      - name: Check required variables and secrets
        run: |
          MISSING=""
          [ -z "${{ vars.REGISTRY }}" ] && MISSING="$MISSING REGISTRY"
          [ -z "${{ vars.INFRA_REPO }}" ] && MISSING="$MISSING INFRA_REPO"
          [ -z "${{ secrets.CR_USERNAME }}" ] && MISSING="$MISSING CR_USERNAME"
          [ -z "${{ secrets.CR_PASSWORD }}" ] && MISSING="$MISSING CR_PASSWORD"
          [ -z "${{ secrets.INFRA_REPO_TOKEN }}" ] && MISSING="$MISSING INFRA_REPO_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "❌ Missing required variables/secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required variables and secrets are set"

  detect-changes:
    needs: validate-config
    runs-on: self-hosted
    outputs:
      user-api: ${{ steps.changes.outputs.user-api }}
      mobile-api: ${{ steps.changes.outputs.mobile-api }}
      connectors-api: ${{ steps.changes.outputs.connectors-api }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          echo "user-api=false" >> $GITHUB_OUTPUT
          echo "mobile-api=false" >> $GITHUB_OUTPUT
          echo "connectors-api=false" >> $GITHUB_OUTPUT

          if echo "$CHANGED" | grep -qE '^services/(build\.gradle\.kts|settings\.gradle\.kts|gradle/|libs/)'; then
            echo "Root build files or libs changed — rebuilding all"
            echo "user-api=true" >> $GITHUB_OUTPUT
            echo "mobile-api=true" >> $GITHUB_OUTPUT
            echo "connectors-api=true" >> $GITHUB_OUTPUT
          else
            echo "$CHANGED" | grep -q '^services/user-api/' && echo "user-api=true" >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -q '^services/mobile-api/' && echo "mobile-api=true" >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -q '^services/connectors-api/' && echo "connectors-api=true" >> $GITHUB_OUTPUT
          fi

  build-user-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-api == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Build and push
        run: ./ci/build-and-push.sh user-api
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD }}

  build-mobile-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-api == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Build and push
        run: ./ci/build-and-push.sh mobile-api
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD }}

  build-connectors-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.connectors-api == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Build and push
        run: ./ci/build-and-push.sh connectors-api
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD }}

  update-infra:
    needs: [build-user-api, build-mobile-api, build-connectors-api]
    if: always() && (needs.build-user-api.result == 'success' || needs.build-mobile-api.result == 'success' || needs.build-connectors-api.result == 'success')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Update infra
        run: |
          SERVICES=""
          [ "${{ needs.build-user-api.result }}" == "success" ] && SERVICES="$SERVICES user-api"
          [ "${{ needs.build-mobile-api.result }}" == "success" ] && SERVICES="$SERVICES mobile-api"
          [ "${{ needs.build-connectors-api.result }}" == "success" ] && SERVICES="$SERVICES connectors-api"
          ./ci/update-infra.sh $SERVICES
        env:
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
