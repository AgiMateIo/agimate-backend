name: Build and Deploy

# Manual only: there is no environment to deploy to yet. Restoring the push trigger means
# restoring automatic production rollouts, so restore it together with an `environment:`
# protection rule on update-infra — otherwise every merge to master ships to users.
on:
  workflow_dispatch:

# The runner is self-hosted and long-lived: a leaked token stays usable on it long after
# the job ends. Nothing here needs to write back to the repo, so the default token is
# narrowed to read-only for every job.
permissions:
  contents: read

jobs:
  validate-config:
    # Deploy targets our own infrastructure — a fork must never reach it. Guarding the
    # first job is enough for the chain below, which is gated on `needs`.
    # The name is the GitVerse repository, not the GitHub mirror: the runner and the
    # deploy secrets live there, so on GitHub the whole chain is meant to skip.
    if: github.repository == 'agimate/agimate-backend'
    runs-on: self-hosted
    steps:
      - name: Check required variables and secrets
        run: |
          MISSING=""
          [ -z "${{ vars.REGISTRY }}" ] && MISSING="$MISSING REGISTRY"
          [ -z "${{ vars.INFRA_REPO_SSH }}" ] && MISSING="$MISSING INFRA_REPO_SSH"
          [ -z "${{ secrets.CR_USERNAME }}" ] && MISSING="$MISSING CR_USERNAME"
          [ -z "${{ secrets.CR_PASSWORD }}" ] && MISSING="$MISSING CR_PASSWORD"
          [ -z "${{ secrets.INFRA_DEPLOY_KEY }}" ] && MISSING="$MISSING INFRA_DEPLOY_KEY"

          if [ -n "$MISSING" ]; then
            echo "❌ Missing required variables/secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required variables and secrets are set"

  detect-changes:
    needs: validate-config
    runs-on: self-hosted
    outputs:
      user-api: ${{ steps.changes.outputs.user-api }}
      control-api: ${{ steps.changes.outputs.control-api }}
      agent-worker: ${{ steps.changes.outputs.agent-worker }}
    steps:
      # Actions are pinned by commit: a tag can be moved to point at new code, a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          # Otherwise the token is left in .git/config on a runner that outlives the job.
          persist-credentials: false

      - name: Detect changed services
        id: changes
        run: |
          echo "user-api=false" >> $GITHUB_OUTPUT
          echo "control-api=false" >> $GITHUB_OUTPUT
          echo "agent-worker=false" >> $GITHUB_OUTPUT

          # A manual run is a deliberate "ship the current state", not a reaction to one
          # commit — comparing against HEAD~1 would build nothing most of the time.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run — rebuilding all services"
            echo "user-api=true" >> $GITHUB_OUTPUT
            echo "control-api=true" >> $GITHUB_OUTPUT
            echo "agent-worker=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^services/(build\.gradle\.kts|settings\.gradle\.kts|gradle/|libs/)'; then
            echo "Root build files or libs changed — rebuilding all"
            echo "user-api=true" >> $GITHUB_OUTPUT
            echo "control-api=true" >> $GITHUB_OUTPUT
            echo "agent-worker=true" >> $GITHUB_OUTPUT
          else
            echo "$CHANGED" | grep -q '^services/user-api/' && echo "user-api=true" >> $GITHUB_OUTPUT || true
            echo "$CHANGED" | grep -q '^services/control-api/' && echo "control-api=true" >> $GITHUB_OUTPUT || true
            echo "$CHANGED" | grep -q '^services/agent-worker/' && echo "agent-worker=true" >> $GITHUB_OUTPUT || true
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}

  build-user-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-api == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and push
        run: ./ci/build-and-push.sh user-api
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD }}

  build-control-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.control-api == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and push
        run: ./ci/build-and-push.sh control-api
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD }}

  build-agent-worker:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent-worker == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and push
        run: ./ci/build-and-push.sh agent-worker
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD }}

  update-infra:
    needs: [build-user-api, build-control-api, build-agent-worker]
    # `always()` ignores upstream skips, so the repository guard is repeated here.
    if: always() && github.repository == 'agimate/agimate-backend' && (needs.build-user-api.result == 'success' || needs.build-control-api.result == 'success' || needs.build-agent-worker.result == 'success')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Update infra
        run: |
          SERVICES=""
          [ "${{ needs.build-user-api.result }}" == "success" ] && SERVICES="$SERVICES user-api"
          [ "${{ needs.build-control-api.result }}" == "success" ] && SERVICES="$SERVICES control-api"
          [ "${{ needs.build-agent-worker.result }}" == "success" ] && SERVICES="$SERVICES agent-worker"
          ./ci/update-infra.sh $SERVICES
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          INFRA_REPO_SSH: ${{ vars.INFRA_REPO_SSH }}
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
