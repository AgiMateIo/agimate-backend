version: '3.8'

services:
  postgres.am:
    image: postgres:18-alpine
    container_name: postgres_am
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data_am:/var/lib/postgresql/data
    networks:
      - am-network

volumes:
  postgres_data_am:
    driver: local

networks:
  am-network:
    driver: bridge