services:
  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api.agimate.lc:8000/
    container_name: agimate_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - am-network

networks:
  am-network:
    external: true
