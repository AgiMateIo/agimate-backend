# Generated by ops/dev-init.sh from services/.env — gitignored, local machine only.
# Safe to edit by hand; `./dev-init.sh --force` re-renders the file and overwrites the edits.

server:
  port: 8180

management:
  server:
    port: 8188

app:
  content:
    language: "__APP_CONTENT_LANGUAGE__"
  secrets:
    # Dev-only KEK. Never reuse outside the local profile.
    encryption-key: "__APP_SECRETS_ENCRYPTION_KEY__"
  integration:
    telegram:
      # Polling needs no public URL — the webhook mode does.
      mode: polling
    webhook-base-url: "__APP_INTEGRATION_WEBHOOK_BASE_URL__"
  net:
    # Локальные цели живут на loopback, который прод-гард отвергает: MCP-серверы, локальные
    # LLM-провайдеры, приёмник вебхука.
    allow-private-targets: true
  user-api:
    # Notifications go to user-api, which owns the devices and the transport. The key is the same
    # value as user-api's app.s2s.key — one secret, both sides, from the same ./dev-init.sh run.
    url: "__APP_USER_API_URL__"
    s2s-key: "__APP_S2S_KEY__"
  files:
    # Signs the /files links; a fixed value keeps already-issued links valid across restarts,
    # where the dev fallback (random per boot) invalidates them.
    url-secret: "__APP_FILES_URL_SECRET__"

centrifugo:
  enabled: true
  url: "http://localhost"
  port: 9000
  public-url: "__CENTRIFUGO_PUBLICURL__"
  api-key: "__CENTRIFUGO_APIKEY__"
  privateKey: "__CENTRIFUGO_PRIVATEKEY__"
  publicKey: "__CENTRIFUGO_PUBLICKEY__"

# Verifies the tokens user-api issues, so it must be the public half of user-api's pair.
jwt:
  publicKey: "__JWT_PUBLICKEY__"

dbos:
  enabled: true

grpc:
  server:
    enabled: true

# The full key counterpart lives in agent-worker's application-local.yaml (agent.grpc.auth-token).
worker-pools:
  authkeys:
    - "__WORKER_POOLS_AUTHKEYS_0__"
