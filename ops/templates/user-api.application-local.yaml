# Generated by ops/dev-init.sh from services/.env — gitignored, local machine only.
# Safe to edit by hand; `./dev-init.sh --force` re-renders the file and overwrites the edits.

server:
  port: 8080

management:
  server:
    port: 8088

spring:
  security:
    oauth2:
      client:
        registration:
          # Spring refuses to start on an empty client-id, so an unconfigured provider gets a
          # placeholder here: the service boots, only the login through it fails.
          google:
            client-id: "__GOOGLE_CLIENT_ID__"
            client-secret: "__GOOGLE_CLIENT_SECRET__"
          yandex:
            client-id: "__YANDEX_CLIENT_ID__"
            client-secret: "__YANDEX_CLIENT_SECRET__"
            redirect-uri: "__APP_OAUTH_FRONTEND_REDIRECT_URL__/redirect"

# Signs the tokens control-api verifies with the public half of this pair.
jwt:
  privateKey: "__JWT_PRIVATEKEY__"
  publicKey: "__JWT_PUBLICKEY__"

app:
  oauth:
    cookie-domain: "__APP_OAUTH_COOKIE_DOMAIN__"
    frontend-redirect-url: "__APP_OAUTH_FRONTEND_REDIRECT_URL__"
    cookie-encryption-key: "__APP_OAUTH_COOKIE_ENCRYPTION_KEY__"
