# Generated by ops/dev-init.sh from services/.env — gitignored, local machine only.
# Safe to edit by hand; `./dev-init.sh --force` re-renders the file and overwrites the edits.

server:
  port: 8080

management:
  server:
    port: 8088

spring:
  security:
    oauth2:
      client:
        registration:
          # The __…__ markers are the renderer's own; the values come from the
          # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_* variables of services/.env.
          # An empty client-id means the provider is not offered: user-api drops such a registration
          # before Spring validates it, so the service starts and only that button stays dead.
          google:
            client-id: "__GOOGLE_CLIENT_ID__"
            client-secret: "__GOOGLE_CLIENT_SECRET__"
          yandex:
            client-id: "__YANDEX_CLIENT_ID__"
            client-secret: "__YANDEX_CLIENT_SECRET__"
            # Yandex takes no .lc address, so the callback is registered on localhost and
            # bounced to api.agimate.lc by the page in ops/caddy/Caddyfile. Spelled out
            # rather than derived from the frontend URL: it follows the Caddyfile, not the
            # frontend, and a rendered guess here silently breaks the Yandex button.
            redirect-uri: "http://localhost:8000/login/redirect"
          github:
            client-id: "__GITHUB_CLIENT_ID__"
            client-secret: "__GITHUB_CLIENT_SECRET__"
          # VK ID takes no client secret: the code exchange is authenticated with PKCE.
          vk:
            client-id: "__VK_CLIENT_ID__"

# Signs the tokens control-api verifies with the public half of this pair.
jwt:
  privateKey: "__JWT_PRIVATEKEY__"
  publicKey: "__JWT_PUBLICKEY__"

app:
  s2s:
    # The same secret control-api holds in app.user-api.s2s-key — one value, both sides.
    key: "__APP_S2S_KEY__"
  push:
    # Push notifications: paste the vendors' credentials into services/.env
    # (APP_PUSH_RUSTORE_PROJECT_ID / APP_PUSH_RUSTORE_SERVICE_KEY, APP_PUSH_FCM_CREDENTIALS)
    # and re-run ./dev-init.sh --force. Empty = subscriptions are still registered, nothing is
    # sent through that channel. The two are parallel — a device registers a token in each.
    rustore:
      project-id: "__APP_PUSH_RUSTORE_PROJECT_ID__"
      service-key: "__APP_PUSH_RUSTORE_SERVICE_KEY__"
    fcm:
      # base64 of the Firebase service account JSON; the project id is read from it.
      credentials: "__APP_PUSH_FCM_CREDENTIALS__"
  oauth:
    cookie-domain: "__APP_OAUTH_COOKIE_DOMAIN__"
    frontend-redirect-url: "__APP_OAUTH_FRONTEND_REDIRECT_URL__"
    cookie-encryption-key: "__APP_OAUTH_COOKIE_ENCRYPTION_KEY__"
