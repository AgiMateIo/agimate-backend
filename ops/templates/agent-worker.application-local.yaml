# Generated by ops/dev-init.sh from services/.env — gitignored, local machine only.
# Safe to edit by hand; `./dev-init.sh --force` re-renders the file and overwrites the edits.

logging:
  level:
    # INFO = the clean per-run story (start → context → turns → answer → finish).
    # Flip to DEBUG for the full trace: credentials/model, tool names, per-progress sends, gRPC retries.
    ru.agimate.agentworker: DEBUG

agent:
  grpc:
    # Worker-pool full key; its authkey counterpart is in control-api's worker-pools.authkeys[0].
    auth-token: "__AGENT_GRPC_AUTHTOKEN__"
  net:
    # Локальная модель живёт на loopback (и по plain http), а прод-гард требует публичный
    # адрес и https.
    allow-private-targets: true
