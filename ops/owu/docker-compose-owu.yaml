services:
  owu:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:main
    container_name: owu
    volumes:
      - open-webui:/app/backend/data
    ports:
      - 8180:8080
    environment:
      - 'WEBUI_SECRET_KEY='
#    extra_hosts:
#      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}

networks:
  agimate_network:
    driver: bridge