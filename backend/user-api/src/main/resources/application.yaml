server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    path: "/error"
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
  max-http-request-header-size: 60KB
  servlet:
    context-path: "/user-api/"

spring:
  application:
    name: "user-api"
  profiles:
    active: "local"
  main:
    banner-mode: off
    lazy-initialization: false
  mvc:
    throw-exception-if-no-handler-found: true
    publish-request-handled-events: false
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/am_core_db?reWriteBatchedInserts=true"
    username: "user"
    password: "password"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000  # 2min
      max-lifetime: 240000  # 4min
      keepalive-time: 30000 # 30sec
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

micrometer:
  observations:
    annotations:
      enabled: true

logging:
  level:
    root: warn
    org.springframework.boot.web.embedded.tomcat.TomcatWebServer: debug # to write opened port
    ru.agimate: debug


springdoc:
  swagger-ui:
    path: "/docs/ui"
    url: "/docs/api"
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    groups-order: asc
    enabled: false
  api-docs:
    path: "/docs/api"
    enabled: false
  paths-to-exclude: "/favicon.ico"