syntax = "proto3";

package ru.agimate.mobile.v1;

option java_package = "ru.agimate.mobile.v1";
option java_multiple_files = true;
option java_outer_classname = "MobileApiProto";

// Service definition for mobile device management
service MobileApiService {
  // Get all connected devices for a user
  rpc GetDevices(GetDevicesRequest) returns (GetDevicesResponse);

  // Get available triggers for a specific device
  rpc GetTriggers(GetTriggersRequest) returns (GetTriggersResponse);

  // Get available actions for a specific device
  rpc GetActions(GetActionsRequest) returns (GetActionsResponse);

  // Push an action to a device
  rpc PushAction(PushActionRequest) returns (PushActionResponse);

  // Stream trigger events from mobile devices (server-side streaming)
  rpc StreamTriggerEvents(StreamTriggerEventsRequest) returns (stream TriggerEvent);
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message GetDevicesRequest {
  string user_id = 1; // User's public ID (UUID string)
}

message GetDevicesResponse {
  repeated ConnectedDevice devices = 1;
}

message GetTriggersRequest {
  string device_id = 1; // Device's public ID (UUID string)
}

message GetTriggersResponse {
  repeated DeviceTrigger triggers = 1;
}

message GetActionsRequest {
  string device_id = 1; // Device's public ID (UUID string)
}

message GetActionsResponse {
  repeated DeviceAction actions = 1;
}

message PushActionRequest {
  string device_id = 1; // Device's public ID (UUID string)
  string data_json = 2; // JSON-encoded action data (flexible Object from Java)
}

message PushActionResponse {
  // Empty response - void return type
}

message StreamTriggerEventsRequest {
  // Empty - stream all events (extensible for future filtering)
}

message TriggerEvent {
  string event_name = 1;    // Format: "mobile.{triggerName}" (e.g., "mobile.shaked")
  string user_pub_id = 2;   // User UUID string
  string device_id = 3;     // Device ID
  string trigger_name = 4;  // Original trigger name (e.g., "shaked")
  string data_json = 5;     // JSON-encoded event data
  string occurred_at = 6;   // ISO-8601 timestamp
}

// ============================================================================
// Data Models
// ============================================================================

message ConnectedDevice {
  string id = 1;          // Device public ID
  string name = 2;        // Device name
  string description = 3; // Device description
}

message DeviceTrigger {
  string name = 1;        // Trigger name (e.g., "shaked")
  string description = 2; // Human-readable description
}

message DeviceAction {
  string name = 1;        // Action name (e.g., "tts")
  string description = 2; // Human-readable description
  map<string, string> params = 3; // Action parameters
}
