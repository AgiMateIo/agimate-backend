server:
  port: 8080
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
  max-http-request-header-size: 60KB
  servlet:
    context-path: "/user/"
    session:
      persistent: false

management:
  server:
    port: 8088

spring:
  application:
    name: "user-api"
  profiles:
    active: "local"
  main:
    banner-mode: off
    lazy-initialization: false
  mvc:
    throw-exception-if-no-handler-found: true
    publish-request-handled-events: false
  web:
    resources:
      add-mappings: false
    error:
      whitelabel:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/am_user_db?reWriteBatchedInserts=true"
    username: "user"
    password: "password"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000  # 2min
      max-lifetime: 240000  # 4min
      keepalive-time: 30000 # 30sec
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  grpc:
    server:
      port: 9090
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
          yandex:
            client-id: ${YANDEX_CLIENT_ID:}
            client-secret: ${YANDEX_CLIENT_SECRET:}
            scope: login:email, login:info, login:avatar
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Yandex
            authorization-grant-type: authorization_code
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id


micrometer:
  observations:
    annotations:
      enabled: true

logging:
  level:
    root: warn
    org.springframework.boot.web.embedded.tomcat.TomcatWebServer: debug # to write opened port
    ru.agimate: debug


jwt:
  privateKey: "***REMOVED***"
  publicKey: "***REMOVED***"
  accessExpiration: 86400 # 24 hours
  refreshExpiration: 604800 # 7 days

app:
  oauth:
    cookie-secure: false  # Set to true in production with HTTPS
    cookie-domain: agimate.lc
    frontend-redirect-url: https://www.agimate.io/login
    allowed-redirect-urls:
      - http://www.agimate.lc:8000/login-check
      - https://www.agimate.ru/login-check
      - https://www.agimate.io/login-check
    # AES-256 encryption key for OAuth2 authorization request cookies (Base64-encoded, 32 bytes)
    # IMPORTANT: Use the same key across all backend instances for multi-instance deployments
    # Generate with: openssl rand -base64 32
    cookie-encryption-key: ***REMOVED***

springdoc:
  swagger-ui:
    path: "/docs/ui"
    url: "/docs/api"
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    groups-order: asc
    enabled: false
  api-docs:
    path: "/docs/api"
    enabled: false
  paths-to-exclude: "/favicon.ico"