server:
  port: 8080
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
  max-http-request-header-size: 60KB
  servlet:
    context-path: "/user/"
    session:
      persistent: false

management:
  server:
    port: 8088

spring:
  application:
    name: "user-api"
  profiles:
    active: "local"
  main:
    banner-mode: off
    lazy-initialization: false
  mvc:
    throw-exception-if-no-handler-found: true
    publish-request-handled-events: false
  web:
    resources:
      add-mappings: false
    error:
      whitelabel:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/am_user_db?reWriteBatchedInserts=true"
    username: "agimate"
    password: "agimate_dev_password"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000  # 2min
      max-lifetime: 240000  # 4min
      keepalive-time: 30000 # 30sec
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    # Liquibase Analytics стучится на config.liquibase.com в main-потоке при старте
    # (+2–5 c к старту, внешний beacon с телеметрией). Выключаем.
    analytics-enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  mail:
    # Почта для подтверждений и сброса пароля. Ключ host здесь намеренно не объявлен: пока его нет
    # в окружении, Spring не поднимает JavaMailSender, а вся отправка выключена — то же правило, по
    # которому провайдер без client-id не предлагается. Установка, которой почта не нужна, ничего не
    # настраивает и стартует как раньше. В проде и локально — env SPRING_MAIL_HOST,
    # SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
    properties:
      mail:
        smtp:
          # Порт 587 у всех целевых провайдеров говорит STARTTLS. Для 465 (implicit TLS) установка
          # доопределяет SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=true.
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  security:
    oauth2:
      client:
        # Credentials are never written here: they come from the environment under these very
        # property names, e.g. SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID.
        # A provider without a client id is switched off (OAuth2RegistrationsConfig) — that is how
        # an installation offers only some of them, and the service still starts.
        registration:
          google:
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
          yandex:
            scope: login:email, login:info, login:avatar
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Yandex
            authorization-grant-type: authorization_code
          github:
            # user:email buys the /user/emails call: the profile itself carries the public address
            # only, and most accounts hide it.
            scope: read:user, user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitHub
          vk:
            # VK ID is a public client: it takes no secret and authenticates the exchange with PKCE,
            # which the resolver applies by itself once the method is `none`.
            client-authentication-method: none
            scope: vkid.personal_info, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: VK ID
            authorization-grant-type: authorization_code
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id
          vk:
            authorization-uri: https://id.vk.com/authorize
            token-uri: https://id.vk.com/oauth2/auth
            user-info-uri: https://id.vk.com/oauth2/user_info
            # VK ID wants the token in the body, not in an Authorization header
            user-info-authentication-method: form
            user-name-attribute: user_id


micrometer:
  observations:
    annotations:
      enabled: true

logging:
  level:
    root: warn
    org.springframework.boot.web.embedded.tomcat.TomcatWebServer: debug # to write opened port
    ru.agimate: debug


# Ключи намеренно без дефолтов: в проде задаются env'ами JWT_PRIVATEKEY/JWT_PUBLICKEY,
# для локальной разработки — в application-local.yaml. Пустое значение = отказ старта
# (SecurityPropertiesGuard).
jwt:
  privateKey: ""
  publicKey: ""
  accessExpiration: 86400 # 24 hours
  refreshExpiration: 604800 # 7 days
  # Приложение открывают раз в неделю — недельный refresh означал бы регулярный разлогин.
  # Access при этом короче суточного: реестр сессий читается только на рефреше, поэтому
  # «выйти на устройстве» догоняет его не раньше, чем истечёт текущий access.
  # См. docs/decisions/native-auth.md
  nativeAccessExpiration: 3600 # 1 hour
  nativeRefreshExpiration: 5184000 # 60 days

app:
  content:
    # Язык системного контента установки — тем же именем и тем же env APP_CONTENT_LANGUAGE, что и в
    # control-api: язык у установки один, а два понятия для него разъехались бы.
    language: ru
  mail:
    # Адрес в поле From. Пусто при заполненном SPRING_MAIL_HOST — отказ старта: это опечатка, а не
    # выбор, и обнаружилась бы она первым же неотправленным письмом. В проде — env APP_MAIL_FROM.
    from: ""
    from-name: "AgiMate"
  s2s:
    # Общий секрет, которым наши же сервисы представляются на /internal/**. То же значение лежит у
    # control-api в app.user-api.s2s-key — хэша нет намеренно, разбор в
    # docs/decisions/push-notifications.md. Генерится `openssl rand -hex 32`.
    # Пусто = внутренняя поверхность не пускает никого. В проде — env APP_S2S_KEY.
    key: ""
  push:
    # Пуш-уведомления на устройства пользователя (docs/decisions/push-notifications.md).
    # Креды из консоли RuStore. Пустой service-key = отправка выключена: подписки устройств
    # регистрируются, уведомления никуда не уходят. Заполненный наполовину — отказ старта:
    # это опечатка, а не выбор. В проде — env APP_PUSH_RUSTORE_PROJECT_ID / _SERVICE_KEY.
    # project-id у стенда и прода обязан быть разным, иначе стенд шлёт на боевые устройства.
    rustore:
      project-id: ""
      service-key: ""
    # Второй канал, FCM (docs/decisions/push-second-channel.md): base64 с JSON сервисного аккаунта
    # Firebase — в проде env APP_PUSH_FCM_CREDENTIALS. Пусто = канал выключен, подписки firebase
    # регистрируются и пропускаются при отправке; нечитаемое — отказ старта. Идентификатор проекта
    # отдельной настройкой не задаётся: он читается из того же JSON, а два источника одной правды
    # разъезжаются молча. Каналы параллельны, не запасные: отказ доставки отправителю не виден.
    fcm:
      credentials: ""
    # Сколько транспорт пытается доставить, если вызывающий не сказал иного. Его собственный
    # дефолт — четыре недели; ответ агента, доехавший к вечеру, не нужен никому.
    ttl: 1h
  oauth:
    cookie-secure: false  # локальный HTTP; в проде включено профилем (application-prod.yaml)
    cookie-domain: agimate.lc
    # Последний рубеж: сначала redirect_to, потом установка, на которую пришёл колбэк
    # (OAuthProperties.resolveFromRedirectUrl). Досюда доходит только адрес, не похожий
    # ни на один из allowed-redirect-urls, — и это именно страница, читающая #rti-.
    frontend-redirect-url: https://www.agimate.io/login-check
    allowed-redirect-urls:
      - http://www.agimate.lc:8000/login-check
      - https://www.agimate.ru/login-check
      - https://www.agimate.io/login-check
    # Адреса нативных клиентов — отдельным списком, а не в allowed-redirect-urls: из веб-адреса
    # вычисляется домен cookie, а у agimate:// домена нет. Смешение ломает именно веб-ветку,
    # поэтому OAuthProperties отказывается стартовать, если списки перепутаны.
    # App Link предпочтительнее схемы: он проверяется доменом (/.well-known/assetlinks.json),
    # и присвоить его чужому приложению нельзя. Схема остаётся фолбэком.
    native-redirect-urls:
      - https://www.agimate.io/app/auth
      - agimate://auth
    # AES-256 encryption key for OAuth2 authorization request cookies (Base64-encoded, 32 bytes)
    # IMPORTANT: Use the same key across all backend instances for multi-instance deployments
    # Generate with: openssl rand -base64 32
    # Дефолта нет намеренно: в проде — env APP_OAUTH_COOKIE_ENCRYPTION_KEY,
    # локально — application-local.yaml. Пустое значение = отказ старта (SecurityPropertiesGuard).
    cookie-encryption-key: ""

springdoc:
  swagger-ui:
    path: "/docs/ui"
    url: "/docs/api"
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    groups-order: asc
    enabled: false
  api-docs:
    path: "/docs/api"
    enabled: false
  paths-to-exclude: "/favicon.ico"