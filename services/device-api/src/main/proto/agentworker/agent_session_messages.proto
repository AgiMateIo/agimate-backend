syntax = "proto3";

package ru.agimate.agentworker;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "AgentSessionMessagesProto";

service AgentSessionMessages {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

enum MessageKind {
  REQUEST = 0;
  RESPONSE = 1;
}

message AppendRequest {
  string agent_pub_id = 1;
  string session_pub_id = 2;
  string run_id = 3;
  int32 starting_turn_idx = 4;
  repeated AppendMessage messages = 5;
}

message AppendMessage {
  MessageKind kind = 1;
  bytes message_json = 2;
  google.protobuf.StringValue text = 3;
  bytes trigger_input_json = 4;
}

message AppendResponse {
  repeated int32 assigned_turn_indices = 1;
}

message GetHistoryRequest {
  string agent_pub_id = 1;
  string session_pub_id = 2;
  int32 last_n_messages = 3;
  int32 since_turn = 4;
}

message GetHistoryResponse {
  repeated HistoryMessage messages = 1;
}

message HistoryMessage {
  int32 turn_idx = 1;
  MessageKind kind = 2;
  bytes message_json = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Int32Value input_tokens = 5;
  google.protobuf.Int32Value output_tokens = 6;
  google.protobuf.StringValue model_name = 7;
}
