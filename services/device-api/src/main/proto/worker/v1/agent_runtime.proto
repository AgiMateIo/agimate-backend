syntax = "proto3";

package ru.agimate.worker.v1;

option java_multiple_files = true;
option java_package = "ru.agimate.worker.v1";
option java_outer_classname = "AgentRuntimeProto";

service AgentRuntime {
  rpc GetAgentSpec(GetAgentSpecRequest) returns (AgentSpec);
  rpc GetSkills(GetSkillsRequest) returns (GetSkillsResponse);
  rpc GetSkill(GetSkillRequest) returns (SkillSpec);
  rpc GetTeamContext(GetTeamContextRequest) returns (TeamContext);
  rpc GetLlmCredentials(GetLlmCredentialsRequest) returns (LlmCredentials);
}

message GetAgentSpecRequest {
  string workflow_id = 1;
  string agent_id = 2;
  string agent_version = 3;
}

message AgentSpec {
  string agent_id = 1;
  string name = 2;
  string agent_type = 3;
  string system_prompt = 4;
}

message GetSkillsRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message SkillConnectorRef {
  string id = 1;
  string connector_code = 2;
  string type = 3;
  string name = 4;
}

message SkillRef {
  string skill_id = 1;
  string name = 2;
  string description = 3;
  repeated SkillConnectorRef connectors = 4;
}

message GetSkillsResponse {
  repeated SkillRef skills = 1;
}

message GetSkillRequest {
  string workflow_id = 1;
  string skill_id = 2;
  string version = 3;
}

message SkillSpec {
  string skill_id = 1;
  string version = 2;
  string name = 3;
  string description = 4;
  bytes definition_json = 5;
}

message GetTeamContextRequest {
  string workflow_id = 1;
  string team_id = 2;
}

message TeamMember {
  string pub_id = 1;
  string name = 2;
  string description = 3;
}

message TeamContext {
  string team_id = 1;
  string name = 2;
  string description = 3;
  repeated TeamMember members = 4;
}

message GetLlmCredentialsRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message LlmCredentials {
  string provider_type = 1;
  string base_url = 2;
  string api_key = 3;
  string model = 4;
}
