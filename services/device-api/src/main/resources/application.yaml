server:
  port: 8080
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
  max-http-request-header-size: 60KB
  servlet:
    context-path: "/device"

management:
  server:
    port: 8088

spring:
  application:
    name: "device-api"
  profiles:
    active: "local"
  main:
    banner-mode: off
    lazy-initialization: false
  mvc:
    throw-exception-if-no-handler-found: true
    publish-request-handled-events: false
  web:
    resources:
      add-mappings: false
    error:
      whitelabel:
        enabled: false
      path: "/error"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/am_device_db?reWriteBatchedInserts=true"
    username: "user"
    password: "password"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000  # 2min
      max-lifetime: 240000  # 4min
      keepalive-time: 30000 # 30sec
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
micrometer:
  observations:
    annotations:
      enabled: true

logging:
  level:
    root: warn
    org.springframework.boot.web: debug # to write opened port
    ru.agimate: debug

springdoc:
  swagger-ui:
    path: "/docs/ui"
    url: "/docs/api"
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    groups-order: asc
    enabled: false
  api-docs:
    path: "/docs/api"
    enabled: false
  paths-to-exclude: "/favicon.ico"

jwt:
  privateKey: ""
  publicKey: ""
  accessExpiration: 86400
  refreshExpiration: 604800

app:
  integration:
    encryption-key: "***REMOVED***"
    webhook-base-url: "http://localhost:8080/device"
  skill:
    dir: "./data/skills"
    max-file-size: 10485760
    max-files-per-skill: 10

dbos:
  enabled: false
  system-database:
    url: "jdbc:postgresql://localhost:5432/dbos"
    username: "dbos_app"
    password: ""
    schema: "dbos"
  queue:
    name: "agent_events"
  workflow:
    name: "handle_event"
    class-name: "agent_worker.workflows"

centrifugo:
  enabled: true
  url: "http://localhost"
  port: 9000
  public-url: "wss://centrifugo.agimate.io"
  api-key: ""
  privateKey: ""
  publicKey: ""

grpc:
  server:
    enabled: false
    port: 9091
    security:
      enabled: false
      certificate-chain: ""
      private-key: ""

worker-pools:
  authkeys: []
