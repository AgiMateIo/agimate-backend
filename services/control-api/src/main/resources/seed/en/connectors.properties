# Connector catalog texts for the EN installation (app.content.language=EN).
# Russian lives in the code (connectorName()/connectorDescription()) and is the last-resort
# fallback, so there is deliberately no seed/ru/connectors.properties — see ConnectorTexts.
# A key is required for every registered connector code; ConnectorTextsTest enforces that.

app.name=App
app.description=A device app: the agent calls tools on a connected computer or phone — screenshots, files, local actions.

claude-code.name=Claude Code
claude-code.description=Claude Code as the executor: the agent takes the calls and runs them in your environment.

acp.name=ACP (IDE)
acp.description=Talk to the agent straight from your IDE over the Agent Client Protocol (Zed and other clients): it reads and writes files and runs commands in your project.

astro.name=Astro
astro.description=Real astronomical calculations: natal chart, transits and synastry from ephemerides, accurate to the arcminute.

board.name=Board
board.description=The team's Kanban board: tasks, statuses, owners and comments — the agent keeps them itself and reacts to changes.

divination.name=Divination
divination.description=Deterministic esoterics: Destiny Matrix, numerology and Tarot spreads.

mcp.name=MCP Server
mcp.description=A connection to an external MCP server: its tools become the agent's own. Each connection has its own tool set, read from the server when it is added.

media.name=Media
media.description=Images for agents whose own model can't do them: generating, editing and recognising pictures through a separate model.

persist-memory.name=Persistent Memory
persist-memory.description=The agent's long-term memory: notes taken during a conversation and a condensed digest of them that outlives sessions.

platform.name=Platform
platform.description=Managing the platform from a conversation: the agent creates other agents, skills, connections and schedules instead of you configuring them by hand.

sheets.name=Sheets
sheets.description=Agent sheets with a declared column schema: filters and summaries over any column, charts and export to CSV/XLSX.

telegram.name=Telegram
telegram.description=A Telegram bot: the agent replies to messages in private chats and groups, and sends photos, documents and video.

time.name=Time
time.description=Current time and deferred tasks: the agent schedules an action for the future and comes back to it on time.

webchat.name=Webchat
webchat.description=Chat with the agent in the web interface — the default channel for talking to the user.
