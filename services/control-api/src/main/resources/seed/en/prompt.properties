# Trusted prompt blocks for the EN installation (app.content.language=EN).
#
# These are NOT UI captions — they are behaviour. Each block is injected into the agent's prompt as a
# trusted instruction, so a change here changes what agents do: whether they answer into the void,
# whether they fabricate a result, whether an attachment reaches the user. Translate for meaning and
# keep every imperative; do not soften them into descriptions.
#
# Russian lives in RunContextService / ContextDirectives and is the fallback, so there is deliberately
# no seed/ru/prompt.properties. PromptTextsTest enforces that every key exists here.
#
# Escapes: \n is a real newline in a properties value; a trailing \ continues the line.

# ---- Platform-level blocks (RunContextService) --------------------------------------------------

# Trigger runs: autonomous event handling, not a conversation.
run.trigger.guidance=- This is autonomous handling of external events, not a conversation. If the \
events require nothing of you, you do not have to answer; a very short reply is fine, for example: \
"Decided to ignore, no action required".\n\
- Every tool call must be justified: call a tool only when the event genuinely requires action, and \
briefly state why you are calling it.\n\
- The only acceptable result is a verifiable artefact: a file or task id from a tool result, a call \
that actually happened. If the tool you need does not exist or the call failed, record a blocker and \
stop. Never report work that did not happen, and never invent file ids.

# Added whenever the run has tools. Weaker models imitate a call in plain text, copying the pattern
# from history — such a "call" is never executed.
run.tool-call.guidance=Call tools only through the structural tool-calling API. Never write a tool \
call as reply text: lines like "🔧 name" or "[tool called ...]" are markup for work that \
already happened, not a template for your reply; a "call" written as text does not execute.

# DIALOGUE runs whose prompt channel supports attachments.
run.attachment.guidance=To attach a file to your reply to the user, put the marker \
[[attach:agf_...]] with the file id (format agf_<uuid>) into your reply text. The id comes either \
from a tool result (the file.id field) or from the description of a file the user uploaded (the line \
"Uploaded file description ... id: agf_..."). The marker is stripped from the text and the file is \
delivered to the channel as an attachment (image/video/document, by file type). Do not invent ids: \
use only the ones you received in this conversation.

# ---- Connector event guidance (ContextDirectives.guidance) --------------------------------------

# One instruction for both board events, so it lives under the connector-wide key.
connector.board.guidance=Below is an event from your team's kanban board. React only if it requires \
action from you specifically: you are the assigned owner, a question was addressed to you, or your \
next step is needed. Do not react to your own actions (actorAgentId == your id). Details and actions \
go through the board connector's tools. Anything you want to tell the team or the user about the task \
must be written strictly as a board comment (create_comment): this run's final text is delivered \
nowhere and will be read by no one — it only serves as a short internal summary.

connector.time.due.guidance=Below is the text of a deferred task you scheduled for yourself earlier \
via time.schedule. Carry it out.
