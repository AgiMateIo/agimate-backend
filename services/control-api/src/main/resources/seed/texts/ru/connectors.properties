# Тексты каталога коннекторов для русской инсталляции (app.content.language=RU).
# Английский живёт в коде (connectorName()/connectorDescription()) и служит фолбэком последней
# надежды, поэтому seed/en/connectors.properties намеренно нет — см. ConnectorTexts.
# Ключ обязан быть у каждого зарегистрированного кода коннектора; это проверяет ConnectorTextsTest.

app.name=Приложение
app.description=Подключённое приложение: агент вызывает тулы на компьютере или телефоне, где оно запущено — скриншот, файлы, локальные действия.

claude-code.name=Claude Code
claude-code.description=Claude Code как исполнитель: агент забирает вызовы себе и выполняет их в вашем окружении.

acp.name=ACP (IDE)
acp.description=Диалог с агентом прямо из IDE по Agent Client Protocol (Zed и другие клиенты): агент читает и пишет файлы, запускает команды в вашем проекте.

astro.name=Астрология
astro.description=Настоящие астрономические расчёты: натальная карта, транзиты и синастрия по эфемеридам с точностью до угловой минуты.

board.name=Доска
board.description=Канбан-доска команды: задачи, статусы, исполнители и комментарии — агент ведёт их сам и реагирует на изменения.

divination.name=Эзотерика
divination.description=Детерминированная эзотерика: Матрица судьбы, нумерология и расклады Таро.

mcp.name=MCP-сервер
mcp.description=Подключение к внешнему MCP-серверу: его тулы становятся доступны агенту как свои. Набор тулов свой у каждого подключения — вычитывается с сервера при добавлении.

media.name=Медиа
media.description=Картинки для агентов, чья модель этого не умеет: генерация, редактирование и распознавание изображений отдельной моделью.

persist-memory.name=Долгая память
persist-memory.description=Долговременная память агента: заметки по ходу диалога и сжатая выжимка из них, которая переживает сессии.

platform.name=Платформа
platform.description=Управление платформой из диалога: агент заводит других агентов, скиллы, подключения и расписания вместо ручной настройки в интерфейсе.

sheets.name=Таблицы
sheets.description=Таблицы агента с объявленной схемой колонок: фильтры и сводки по любой колонке, графики и выгрузка в CSV/XLSX.

telegram.name=Telegram
telegram.description=Бот в Telegram: агент отвечает на сообщения в личных чатах и группах, отправляет фото, документы и видео.

time.name=Время
time.description=Текущее время и отложенные задачи: агент планирует действие на будущее и сам возвращается к нему в срок.

webchat.name=Веб-чат
webchat.description=Чат с агентом в веб-интерфейсе — канал по умолчанию для диалога с пользователем.
