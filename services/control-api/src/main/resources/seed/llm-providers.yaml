# Catalogue of known LLM providers — the prefill for the «add a provider» form.
#
# Not under seed/<lang>/: everything here is language-independent except `description`, which lives
# in English as the source and the fallback (translations: seed/<lang>/llm-providers.properties, the
# same asymmetry as connectors.properties). `name` is a brand and is never translated.
#
# Entries are upserted by `code` on every start, so a stale model id is fixed by a deploy. The
# `enabled` flag in the database is never written back — see the migration's comment.
#
# Only providers that work end to end belong here. The agent loop speaks the OpenAI dialect alone
# (agent-worker ModelFactory), so ANTHROPIC and GEMINI provider types — which discovery does
# support — would promise an agent that cannot run.

providers:

  - code: openrouter
    name: OpenRouter
    description: >-
      Gateway to models from all major vendors — one key, one balance, no per-vendor contracts.
    providerType: OPENAI_COMPATIBLE
    baseUrl: https://openrouter.ai/api/v1
    mediaTransport: CHAT_MODALITIES
    apiKeyUrl: https://openrouter.ai/keys
    sortOrder: 10
    # Pinned model ids, not OpenRouter's `~vendor/model-latest` aliases: an alias silently changes
    # what the user is billed for and what the agent can do — a new generation may drop a parameter
    # the loop relies on. The list ages instead, and that is the failure we can see and fix.
    # Three vendors per purpose, so one vendor's outage is a step down the list, not a dead purpose;
    # the resolver keeps this order and skips registry rows marked UNAVAILABLE.
    # No `-preview`, `:batch` or `:free` variants: previews vanish, batch is an async endpoint the
    # agent loop cannot call, free tiers are rate-limited into uselessness.
    purposePriority:
      # Cheapest first — platform keys are our money; the stronger models behind it are the fallback.
      CHAT:
        - deepseek/deepseek-v4.1-flash
        - z-ai/glm-5.3
        - google/gemini-3.8-flash
      VISION:
        - google/gemini-3.5-flash-lite
        - openai/gpt-5.6-luna
        - anthropic/claude-haiku-4.5
      IMAGE:
        - google/gemini-3.1-flash-image
        - google/gemini-2.5-flash-image
        - openai/gpt-5.4-image-2
      AUDIO_IN:
        - google/gemini-3.6-flash
        - openai/gpt-audio-mini
        - mistralai/voxtral-small-24b-2507
      AUDIO_OUT:
        - openai/gpt-audio-mini
        - openai/gpt-audio
      # The platform's chores (compacting a long conversation, titling a session): a retelling, not
      # a decision, so the cheap end of each vendor. A provider without this key falls back to the
      # agent's CHAT model.
      ROUTINE:
        - google/gemini-3.5-flash-lite
        - openai/gpt-5.6-luna
        - deepseek/deepseek-v4.1-flash

  - code: polza
    name: Polza.ai
    description: >-
      Russian gateway to models from all major vendors; pays in roubles, no foreign card needed.
    providerType: OPENAI_COMPATIBLE
    baseUrl: https://api.polza.ai/api/v1
    # Image models are unreachable over chat/completions here — they live on POST /media
    # (docs/decisions/media-transport.md).
    mediaTransport: MEDIA_ENDPOINT
    sortOrder: 20
    # openai/gpt-5.2 is hosted here without tools, so it stays out of CHAT. Purposes with no confirmed
    # id are left out: «not configured» reaches the user, a guessed id fails on their money.
    purposePriority:
      CHAT:
        - deepseek/deepseek-v4.1-flash
        - z-ai/glm-5.3
        - google/gemini-3.8-flash
      VISION:
        - openai/gpt-5.2
        - openai/gpt-5.1
      IMAGE:
        - google/gemini-3.1-flash-lite-image
      ROUTINE:
        - google/gemini-3.5-flash-lite
        - openai/gpt-5.6-luna
        - deepseek/deepseek-v4.1-flash

  - code: proxyapi
    name: ProxyAPI
    description: >-
      Russian proxy to the first-party OpenAI, Anthropic and Google APIs; pays in roubles, no
      foreign card needed.
    providerType: OPENAI_COMPATIBLE
    # The unified endpoint, routed by the vendor/model id — one dialect over all vendors.
    baseUrl: https://api.proxyapi.ru/v1
    apiKeyUrl: https://console.proxyapi.ru
    sortOrder: 30
    # IMAGE and AUDIO are absent deliberately: image generation here lives on /images/generations
    # (the IMAGES_GENERATIONS transport is not implemented — docs/decisions/media-transport.md),
    # audio on dedicated STT/TTS endpoints the chat loop cannot call.
    purposePriority:
      CHAT:
        - deepseek/deepseek-v4.1-flash
        - z-ai/glm-5.3
        - google/gemini-3.8-flash
      VISION:
        - google/gemini-3.5-flash-lite
        - openai/gpt-5.6-luna
        - anthropic/claude-sonnet-5
      ROUTINE:
        - google/gemini-3.5-flash-lite
        - openai/gpt-5.6-luna
        - deepseek/deepseek-v4.1-flash

  - code: deepseek
    name: DeepSeek
    description: >-
      First-party API of the DeepSeek V4 models — capable chat at a fraction of the flagship price.
    providerType: OPENAI_COMPATIBLE
    baseUrl: https://api.deepseek.com/v1
    apiKeyUrl: https://platform.deepseek.com/api_keys
    sortOrder: 40
    # Chat only: the API takes no image input and serves no image or audio models (vendor docs,
    # July 2026). The old `deepseek-v4-flash` is only an alias of `deepseek-flash` now.
    purposePriority:
      CHAT:
        - deepseek-flash
        - deepseek-v4-pro
      ROUTINE:
        - deepseek-flash

  - code: neuraldeep
    name: NeuralDeep
    description: >-
      Russian hub running Qwen on its own GPUs in Russia; a monthly subscription in roubles, no
      foreign card needed.
    providerType: OPENAI_COMPATIBLE
    baseUrl: https://api.neuraldeep.ru/v1
    apiKeyUrl: https://neuraldeep.ru/app
    sortOrder: 50
    # Ids checked against https://neuraldeep.ru/api/public/wallet-prices — the same table the money
    # is charged from — in September 2026. Only models the hub serves on every tariff are listed:
    # the rest need either the rouble wallet or a particular subscription, so on someone else's key
    # they fail instead of answering.
    # IMAGE and AUDIO are absent by design: image generation lives on an async task API
    # (POST /v1/images/* → poll the task → fetch the bytes), which is neither of the two transports
    # we implement (docs/decisions/media-transport.md), and Whisper/TTS sit on dedicated endpoints
    # the chat loop cannot call.
    purposePriority:
      # The vendor's own default in every example, then a newer generation, then a different family
      # so one model's trouble is a step down the list. The vendor's index lists tool calling only
      # on the reasoning variants, and an agent loop without tools is not an agent.
      CHAT:
        - qwen3.6-35b-a3b
        - qwen3.8-27b
        - gpt-oss-120b
      # Here `-noreason` is exactly right: describing a picture needs no thinking budget, and a
      # subscription bills per request, so latency is the only axis left.
      VISION:
        - qwen3.6-fp8-noreason
        - qwen3.8-27b-noreason
        - gemma-4-31b-noreason
      ROUTINE:
        - qwen3.8-27b-noreason
        - qwen3.6-fp8-noreason
        - gemma-4-31b-noreason
