# Catalogue of known LLM providers — the prefill for the «add a provider» form.
#
# Not under seed/<lang>/: everything here is language-independent except `description`, which lives
# in English as the source and the fallback (translations: seed/<lang>/llm-providers.properties, the
# same asymmetry as connectors.properties). `name` is a brand and is never translated.
#
# Entries are upserted by `code` on every start, so a stale model id is fixed by a deploy. The
# `enabled` flag in the database is never written back — see the migration's comment.
#
# Only providers that work end to end belong here. The agent loop speaks the OpenAI dialect alone
# (agent-worker ModelFactory), so ANTHROPIC and GEMINI provider types — which discovery does
# support — would promise an agent that cannot run.

providers:

  - code: openrouter
    name: OpenRouter
    description: >-
      Gateway to models from all major vendors — one key, one balance, no per-vendor contracts.
    providerType: OPENAI_COMPATIBLE
    baseUrl: https://openrouter.ai/api/v1
    mediaTransport: CHAT_MODALITIES
    apiKeyUrl: https://openrouter.ai/keys
    sortOrder: 10
    # Pinned model ids, not OpenRouter's `~vendor/model-latest` aliases: an alias silently changes
    # what the user is billed for and what the agent can do — a new generation may drop a parameter
    # the loop relies on. The list ages instead, and that is the failure we can see and fix.
    # Three vendors per purpose, so one vendor's outage is a step down the list, not a dead purpose;
    # the resolver keeps this order and skips registry rows marked UNAVAILABLE.
    # No `-preview`, `:batch` or `:free` variants: previews vanish, batch is an async endpoint the
    # agent loop cannot call, free tiers are rate-limited into uselessness.
    purposePriority:
      CHAT:
        - anthropic/claude-sonnet-5
        - openai/gpt-5.6-terra
        - google/gemini-3.6-flash
      VISION:
        - google/gemini-3.5-flash-lite
        - openai/gpt-5.6-luna
        - anthropic/claude-haiku-4.5
      IMAGE:
        - google/gemini-3.1-flash-image
        - google/gemini-2.5-flash-image
        - openai/gpt-5.4-image-2
      AUDIO_IN:
        - google/gemini-3.6-flash
        - openai/gpt-audio-mini
        - mistralai/voxtral-small-24b-2507
      AUDIO_OUT:
        - openai/gpt-audio-mini
        - openai/gpt-audio

  - code: polza
    name: Polza.ai
    description: >-
      Russian gateway to models from all major vendors; pays in roubles, no foreign card needed.
    providerType: OPENAI_COMPATIBLE
    baseUrl: https://api.polza.ai/api/v1
    # Image models are unreachable over chat/completions here — they live on POST /media
    # (docs/decisions/media-transport.md).
    mediaTransport: MEDIA_ENDPOINT
    sortOrder: 20
    # These ids come from the July 2026 measurements recorded in the decision doc, not from a live
    # listing — Polza's namespace differs from OpenRouter's and has no floating aliases. Purposes we
    # have no confirmed id for are left out entirely: «not configured» is an error addressed to the
    # user, whereas a guessed id would fail at call time on their money.
    purposePriority:
      CHAT:
        - openai/gpt-5.2
        - gpt-5.1
      VISION:
        - openai/gpt-5.2
        - gpt-5.1
      IMAGE:
        - gemini-3.1-flash-lite-image

  - code: proxyapi
    name: ProxyAPI
    description: >-
      Russian proxy to the first-party OpenAI, Anthropic and Google APIs; pays in roubles, no
      foreign card needed.
    providerType: OPENAI_COMPATIBLE
    # The unified OpenAI-compatible endpoint (routes by id prefix: openai/, anthropic/, gemini/),
    # not the per-vendor passthroughs on api.proxyapi.ru — one dialect over all vendors is the only
    # form the agent loop can use.
    baseUrl: https://openai.api.proxyapi.ru/v1
    apiKeyUrl: https://console.proxyapi.ru
    sortOrder: 30
    # IMAGE and AUDIO are absent deliberately: image generation here lives on /images/generations
    # (the IMAGES_GENERATIONS transport is not implemented — docs/decisions/media-transport.md),
    # audio on dedicated STT/TTS endpoints the chat loop cannot call. The OpenRouter passthrough
    # does speak chat+modalities but carries no OpenAI/Anthropic/Google models, so it does not
    # change the picture. Ids checked against the ProxyAPI price list, July 2026: only the current
    # generation is served (no gpt-5.5/gpt-5-mini, no claude-haiku), hence gpt-5.6 tiers — terra
    # is the gpt-5.5-class workhorse, luna the cheap vision-capable one.
    purposePriority:
      CHAT:
        - anthropic/claude-sonnet-5
        - openai/gpt-5.6-terra
        - gemini/gemini-3.6-flash
      VISION:
        - gemini/gemini-3.5-flash-lite
        - openai/gpt-5.6-luna
        - anthropic/claude-sonnet-5

  - code: deepseek
    name: DeepSeek
    description: >-
      First-party API of the DeepSeek V4 models — capable chat at a fraction of the flagship price.
    providerType: OPENAI_COMPATIBLE
    baseUrl: https://api.deepseek.com/v1
    apiKeyUrl: https://platform.deepseek.com/api_keys
    sortOrder: 40
    # Chat only: the API takes no image input and serves no image or audio models (vendor docs,
    # July 2026). Both ids are pinned per-version — the floating deepseek-chat/deepseek-reasoner
    # aliases are gone from the vendor's docs. Pro before flash: quality-first, like every other
    # CHAT list here.
    purposePriority:
      CHAT:
        - deepseek-v4-pro
        - deepseek-v4-flash
