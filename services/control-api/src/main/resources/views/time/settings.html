<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg-soft: var(--color-background-secondary, #f4f5f7);
    --text: var(--color-text-primary, #1c1f24);
    --text-soft: var(--color-text-secondary, #5f6672);
    --line: var(--color-border-primary, #dfe2e7);
    --accent: var(--color-text-info, #2f6fdd);
    --danger: var(--color-text-danger, #c2362f);
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --radius: var(--border-radius-md, 8px);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #17191d);
    --bg-soft: var(--color-background-secondary, #22252b);
    --text: var(--color-text-primary, #e8eaed);
    --text-soft: var(--color-text-secondary, #9aa1ac);
    --line: var(--color-border-primary, #343841);
    --accent: var(--color-text-info, #7aa7f5);
    --danger: var(--color-text-danger, #f08a84);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
  main { display: grid; gap: 12px; padding: 16px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .hint { margin: 0; color: var(--text-soft); font-size: 12px; }
  .meta { color: var(--text-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
  input {
    font: inherit; color: var(--text); background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px;
  }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input { flex: 1 1 220px; min-width: 0; }
  button {
    font: inherit; border-radius: var(--radius); padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg);
  }
  button.quiet { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .suggest { background: var(--bg-soft); border-radius: var(--radius); padding: 8px 10px; }
  .suggest[hidden] { display: none; }
  .status { font-size: 12px; color: var(--text-soft); min-height: 18px; }
  .status.error { color: var(--danger); }
  section { display: grid; gap: 8px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  li { background: var(--bg-soft); border-radius: var(--radius); padding: 8px 10px; display: grid; gap: 4px; }
  li.empty { color: var(--text-soft); font-style: italic; }
  .task-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .task-prompt { white-space: pre-wrap; overflow-wrap: anywhere; }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); padding: 2px 10px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h2 id="title" data-t="title"></h2>
  <p class="hint" data-t="hint"></p>
  <div class="suggest row" id="suggest" hidden>
    <span id="suggest-text"></span>
    <button id="suggest-apply" class="quiet" data-t="apply"></button>
  </div>
  <form class="row" id="form">
    <input id="zone" list="zones" autocomplete="off" spellcheck="false" aria-labelledby="title">
    <datalist id="zones"></datalist>
    <button id="save" type="submit" disabled data-t="save"></button>
    <button id="reset" type="button" class="quiet" data-t="reset"></button>
  </form>
  <span class="meta" id="now"></span>
  <span class="status" id="status" role="status"></span>

  <section aria-labelledby="tasks-title">
    <header>
      <h2 id="tasks-title" data-t="tasksTitle"></h2>
      <button id="tasks-reload" class="quiet" data-t="reload"></button>
    </header>
    <p class="hint" data-t="tasksHint"></p>
    <ol id="tasks"></ol>
    <span class="status" id="tasks-status" role="status"></span>
  </section>
</main>

<script>
(() => {
  const TEXTS = {
    en: {
      title: "Timezone", hint: "The agent tells time, sets reminders and runs schedules in this zone. Empty — UTC.",
      save: "Save", reset: "Reset to UTC", apply: "Set",
      suggest: (zone) => "Your timezone is " + zone + ".", placeholder: "Europe/Berlin",
      now: (time) => "Agent's time now: " + time, saved: "Saved", loading: "Loading…",
      unknown: "Unknown timezone", failed: "Failed: ",
      tasksTitle: "Scheduled tasks", tasksHint: "What the agent set itself to do later. Cancelling stops a repeating task for good.",
      reload: "Reload", noTasks: "No scheduled tasks", cancel: "Cancel", cancelled: "Task cancelled",
      confirmCancel: "Sure? Press again", next: "Next run: ",
      once: "Once", every: (s) => "Every " + duration(s, ["s", "min", "h", "d"]), cron: (c, z) => "Cron " + c + (z ? " (" + z + ")" : "")
    },
    ru: {
      title: "Часовой пояс", hint: "В этом поясе агент называет время, ставит напоминания и ведёт расписания. Пусто — UTC.",
      save: "Сохранить", reset: "Сбросить на UTC", apply: "Установить",
      suggest: (zone) => "Ваш часовой пояс — " + zone + ".", placeholder: "Europe/Moscow",
      now: (time) => "Сейчас у агента: " + time, saved: "Сохранено", loading: "Загрузка…",
      unknown: "Неизвестный часовой пояс", failed: "Ошибка: ",
      tasksTitle: "Запланированные задачи", tasksHint: "Что агент поручил себе на потом. Отмена останавливает повторяющуюся задачу насовсем.",
      reload: "Обновить", noTasks: "Задач нет", cancel: "Отменить", cancelled: "Задача отменена",
      confirmCancel: "Точно? Нажмите ещё раз", next: "Следующий запуск: ",
      once: "Однократно", every: (s) => "Каждые " + duration(s, ["с", "мин", "ч", "дн"]), cron: (c, z) => "Cron " + c + (z ? " (" + z + ")" : "")
    }
  };
  let t = TEXTS.en;

  function duration(seconds, units) {
    const steps = [[86400, units[3]], [3600, units[2]], [60, units[1]]];
    for (const [size, unit] of steps) {
      if (seconds % size === 0) return (seconds / size) + " " + unit;
    }
    return seconds + " " + units[0];
  }

  // --- MCP Apps bridge: JSON-RPC over postMessage to the host ---
  let nextId = 1;
  const pending = new Map();
  function request(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  }
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0" || message.id == null || !pending.has(message.id)) return;
    const { resolve, reject } = pending.get(message.id);
    pending.delete(message.id);
    message.error ? reject(new Error(message.error.message)) : resolve(message.result);
  });

  async function callTool(name, args) {
    const result = await request("tools/call", { name, arguments: args || {} });
    if (result.isError) {
      const text = (result.content || []).map((block) => block.text || "").join("\n");
      throw new Error(text || name);
    }
    return result.structuredContent || {};
  }

  // --- UI ---
  const $ = (id) => document.getElementById(id);
  const zone = $("zone"), save = $("save");
  const zones = typeof Intl.supportedValuesOf === "function" ? Intl.supportedValuesOf("timeZone") : [];
  const browserZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
  let saved = "";

  function status(text, isError) {
    $("status").textContent = text || "";
    $("status").classList.toggle("error", !!isError);
  }

  function applyTexts() {
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    zone.placeholder = t.placeholder;
    $("zones").replaceChildren(...zones.map((z) => Object.assign(document.createElement("option"), { value: z })));
  }

  function show(settings) {
    saved = settings.timezone || "";
    zone.value = saved;
    save.disabled = true;
    $("now").textContent = settings.now ? t.now(settings.now) : "";
    const offer = !saved && browserZone && browserZone !== "UTC";
    $("suggest").hidden = !offer;
    if (offer) $("suggest-text").textContent = t.suggest(browserZone);
  }

  async function store(value) {
    save.disabled = true;
    try {
      show(await callTool("save_settings", { timezone: value }));
      status(t.saved);
      // nextRunAt is rendered in the agent's zone, which has just changed.
      reloadTasks();
    } catch (e) {
      save.disabled = false;
      status(t.failed + e.message, true);
    }
  }

  function schedule(task) {
    const config = task.config || {};
    if (task.taskType === "PERIODIC") return t.every(Number(config.intervalSeconds));
    if (task.taskType === "CRON") return t.cron(config.cron, config.zone);
    return t.once;
  }

  function taskItem(task) {
    const item = document.createElement("li");
    const head = document.createElement("div");
    head.className = "task-head";
    const when = Object.assign(document.createElement("span"), {
      className: "meta", textContent: schedule(task) + " · " + t.next + (task.nextRunAt || "—")
    });
    const cancel = Object.assign(document.createElement("button"), { className: "danger", textContent: t.cancel });
    // A second press confirms: a sandboxed frame may not be allowed window.confirm.
    let armed = false;
    cancel.addEventListener("click", async () => {
      if (!armed) {
        armed = true;
        cancel.textContent = t.confirmCancel;
        setTimeout(() => { armed = false; cancel.textContent = t.cancel; }, 4000);
        return;
      }
      cancel.disabled = true;
      try {
        await callTool("cancel_task", { id: task.id });
        await loadTasks();
        taskStatus(t.cancelled);
      } catch (e) {
        cancel.disabled = false;
        taskStatus(t.failed + e.message, true);
      }
    });
    head.append(when, cancel);
    item.append(head, Object.assign(document.createElement("div"), { className: "task-prompt", textContent: task.prompt || "" }));
    return item;
  }

  function taskStatus(text, isError) {
    $("tasks-status").textContent = text || "";
    $("tasks-status").classList.toggle("error", !!isError);
  }

  async function loadTasks() {
    const { tasks = [] } = await callTool("scheduled_tasks");
    $("tasks").replaceChildren(...(tasks.length
      ? tasks.map(taskItem)
      : [Object.assign(document.createElement("li"), { className: "empty", textContent: t.noTasks })]));
  }

  async function reloadTasks() {
    taskStatus(t.loading);
    try {
      await loadTasks();
      taskStatus("");
    } catch (e) {
      taskStatus(t.failed + e.message, true);
    }
  }

  $("tasks-reload").addEventListener("click", reloadTasks);

  zone.addEventListener("input", () => {
    const value = zone.value.trim();
    save.disabled = value === saved || (value !== "" && zones.length > 0 && !zones.includes(value));
    status(value && zones.length && !zones.includes(value) ? t.unknown : "");
  });
  $("form").addEventListener("submit", (event) => {
    event.preventDefault();
    store(zone.value.trim());
  });
  $("reset").addEventListener("click", () => store(""));
  $("suggest-apply").addEventListener("click", () => store(browserZone));

  new ResizeObserver(() => {
    notify("ui/notifications/size-changed", { height: Math.ceil(document.documentElement.scrollHeight) });
  }).observe(document.body);

  (async () => {
    const init = await request("ui/initialize", {
      protocolVersion: "2026-01-26",
      appInfo: { name: "agimate-time", version: "1" },
      appCapabilities: {}
    });
    const context = (init && init.hostContext) || {};
    const lang = String(context.locale || navigator.language || "en").slice(0, 2).toLowerCase();
    t = TEXTS[lang] || TEXTS.en;
    if (context.theme === "dark") document.documentElement.dataset.theme = "dark";
    const variables = (context.styles && context.styles.variables) || {};
    Object.entries(variables).forEach(([name, value]) => document.documentElement.style.setProperty(name, value));
    applyTexts();
    notify("ui/notifications/initialized", {});
    status(t.loading);
    show(await callTool("get_settings"));
    status("");
    await reloadTasks();
  })().catch((e) => status(t.failed + e.message, true));
})();
</script>
</body>
</html>
