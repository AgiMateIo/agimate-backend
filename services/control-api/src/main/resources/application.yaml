server:
  port: 8080
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
  max-http-request-header-size: 60KB
  servlet:
    context-path: "/control"

management:
  server:
    port: 8088

spring:
  application:
    name: "control-api"
  profiles:
    active: "local"
  main:
    banner-mode: off
    lazy-initialization: false
  mvc:
    throw-exception-if-no-handler-found: true
    publish-request-handled-events: false
  web:
    resources:
      add-mappings: false
    error:
      whitelabel:
        enabled: false
      path: "/error"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/am_control_db?reWriteBatchedInserts=true"
    username: "agimate"
    password: "agimate_dev_password"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000  # 2min
      max-lifetime: 240000  # 4min
      keepalive-time: 30000 # 30sec
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Liquibase Analytics стучится на config.liquibase.com в main-потоке при старте
    # (+2–5 c к старту, внешний beacon с телеметрией). Выключаем.
    analytics-enabled: false
  servlet:
    multipart:
      # Аплоад файлов device-apps (/app/files); содержательный лимит — app.files.max-file-size-bytes
      # (50 MB), здесь чуть выше, чтобы отказ был доменным (400), а не транспортным.
      max-file-size: 51MB
      max-request-size: 52MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    jpa:
      repositories:
        # Bootstrap Hibernate/EMF в фоновом потоке: Tomcat/gRPC поднимаются, не дожидаясь JPA;
        # первый, кто коснётся репозиториев (обычно ConnectorBootstrap на ready), дождётся EMF.
        bootstrap-mode: deferred
micrometer:
  observations:
    annotations:
      enabled: true

logging:
  level:
    root: warn
    org.springframework.boot.web: debug # to write opened port
    ru.agimate: debug

springdoc:
  swagger-ui:
    path: "/docs/ui"
    url: "/docs/api"
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    groups-order: asc
    enabled: false
  api-docs:
    path: "/docs/api"
    enabled: false
  paths-to-exclude: "/favicon.ico"

jwt:
  privateKey: ""
  publicKey: ""
  accessExpiration: 86400
  refreshExpiration: 604800

app:
  content:
    # Язык системного контента инсталляции: пресеты и скилы сидятся из resources/seed/<lang>/,
    # каталог коннекторов — из seed/<lang>/connectors.properties. Не язык ответов агента —
    # тот определяется языком пользователя. Значения: en | ru (енам ContentLanguage).
    # Первоисточник — en: он живёт в коде и служит фолбэком, бандла seed/en/*.properties нет.
    # Пресеты и скилы сидятся один раз (seed-only-if-missing), поэтому смена языка на уже
    # засеянном окружении их не переводит — это выбор для свежей инсталляции.
    language: "ru"
  frontend:
    # База для deep-link'ов, которые платформенные тулы возвращают агенту (напр. экран подключения
    # интеграции, куда пользователь вводит секрет вне LLM). В проде — env APP_FRONTEND_BASE_URL.
    base-url: "http://localhost:3000"
  integration:
    webhook-base-url: "http://localhost:8080/control"
  secrets:
    # KEK (master key) для envelope-шифрования секретов (AES-256, base64 32 байта).
    # Дефолта нет намеренно: в проде задаётся env'ом APP_SECRETS_ENCRYPTION_KEY,
    # для локальной разработки — в application-local.yaml. Пустое значение = отказ старта.
    encryption-key: ""
  connectors:
    mcp:
      # SSRF-guard: разрешать ли MCP-серверы на приватных/loopback/link-local адресах.
      # В проде держим false; true — для локальной разработки против localhost-серверов.
      allow-private-targets: false
  files:
    # Файловый слой коннекторов (docs/connectors/files.md).
    # backend: local — блобы на диске (local-dir, пусто = ~/.agimate/files); s3 — S3/MinIO
    # (bucket/endpoint/region ниже; endpoint пустой = AWS; креды — только env:
    # APP_FILES_ACCESS_KEY / APP_FILES_SECRET_KEY, без них — AWS credentials chain).
    backend: local
    local-dir: ""
    bucket: agimate-files
    region: us-east-1
    endpoint: ""
    path-style: true
    # HMAC-секрет подписанных ссылок на файлы (GET /files/…?exp&sig — webchat-вложения).
    # Дефолта нет намеренно: в проде — env APP_FILES_URL_SECRET (без него отказ старта),
    # в dev пустое значение = случайный per-boot ключ.
    url-secret: ""

dbos:
  enabled: false
  # Shared with agent-worker (agent.dbos.*) — producer and consumer must address the same
  # system database, otherwise the run_agent queue silently has no consumer.
  system-database:
    url: "jdbc:postgresql://localhost:5432/dbos"
    username: "agimate"
    password: "agimate_dev_password"
    schema: "dbos"


centrifugo:
  enabled: true
  url: "http://localhost"
  port: 9000
  public-url: "wss://centrifugo.agimate.io"
  api-key: ""
  privateKey: ""
  publicKey: ""
  token-ttl-seconds: 3600

inbound-rate-limit:
  enabled: true
  triggers-per-minute: 120
  tool-results-per-minute: 120
  file-uploads-per-minute: 30

grpc:
  server:
    enabled: false
    port: 9091
    security:
      enabled: false
      certificate-chain: ""
      private-key: ""

worker-pools:
  authkeys: []
