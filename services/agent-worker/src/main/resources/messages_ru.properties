# Русские пользовательские нотисы (переопределяют базовый messages.properties при agent.response.language=ru).
# Пунктуация без длинного тире, см. комментарий в messages.properties.
notice.max-turns=Извини, не получилось завершить ответ: агент превысил лимит шагов.
notice.model-error=Извини, произошла ошибка при обращении к модели. Попробуй ещё раз.
notice.auth-error=Извини, не удаётся подключиться к модели. Проверь настройки API-ключа.
notice.no-model=Извини, не могу ответить: агенту не настроена модель (или выбранная недоступна). Подключи LLM-провайдера и выбери модель в настройках агента.
notice.cancelled=Остановлено по твоей просьбе.
notice.cancelled-did-run=Успел выполнить:
notice.empty-answer=Извини, модель вернула пустой ответ. Попробуй ещё раз или переформулируй запрос.
notice.truncated=Извини, ответ не поместился в лимит. Переформулируй запрос покороче или разбей на части.
notice.filtered=Извини, не могу ответить на это сообщение.
notice.infra-error=Извини, произошла внутренняя ошибка при обработке сообщения. Попробуй ещё раз чуть позже.

# Текст для модели, не для пользователя, см. комментарий в messages.properties.
prompt.wrap-up=Бюджет шагов рана почти исчерпан: осталось не более двух ходов. Заверши работу сейчас: дай пользователю финальный ответ из того, что уже готово (приложи готовые файлы и результаты), и явно отметь, что сделать не успел. Новый вызов инструмента делай только если без него ответ невозможен.
