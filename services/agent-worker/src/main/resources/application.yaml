server:
  port: 8089

management:
  server:
    # Same port as the application one on purpose: that is what keeps management in the same
    # context, so the worker runs one web server and it serves nothing but /actuator/**. Not
    # 8088 — in compose the worker shares control-api's network namespace, and 8088 is theirs.
    port: 8089

spring:
  application:
    name: agent-worker
  main:
    banner-mode: off
  profiles:
    active: "local"
  messages:
    # Unknown agent.response.language falls back to the base bundle (English), not the JVM locale.
    fallback-to-system-locale: false

logging:
  level:
    # warn, like the other two services: root INFO was harmless only while the appender cut
    # everything below WARN anyway, and without that filter it buries the per-run story in
    # Spring, Hibernate and DBOS chatter.
    root: warn
    # INFO = the clean per-run story (start → context → turns → answer → finish).
    # Flip to DEBUG for the full trace: credentials/model, tool names, per-progress sends, gRPC retries.
    ru.agimate.agentworker: INFO
    # Startup lines of the shared outbound setup — trust anchors and the egress proxy — which have to
    # match control-api's and can only be compared if both services print them.
    ru.agimate.common.net: INFO
    # Spring AI's stream aggregator logs every broken stream at ERROR with a stack trace; LlmCall
    # logs the same failure a line later with its cause and classification.
    org.springframework.ai.chat.model.MessageAggregator: off

# Worker configuration. Values here are defaults; override any of them via
# environment variables (relaxed binding), e.g. AGENT_GRPC_TARGET, AGENT_DBOS_DATABASE_URL.
agent:
  grpc:
    target: "localhost:9091"
    use-tls: false
    ca-cert:
    auth-token: ""
    request-timeout: 10s
    connect-timeout: 5s
  agent:
    id: "agent-default"
    # Кап ходов агентного цикла на ран (1 ход = 1 LLM-вызов); у капа — мягкая посадка
    # (wrap-up-нотис + финальный ход без тулов), а не жёсткий обрыв.
    max-turns: 30
  llm:
    # Бюджеты вокруг одного вызова модели: до первого чанка, между чанками, потолок всего вызова.
    # Что они значат и какой инвариант связывает их с control-api — javadoc AgentProperties.Llm.
    first-chunk-timeout: 90s
    idle-timeout: 180s
    call-timeout: 5m
  concurrency:
    llm: 3
  app:
    url: "https://agimate.io"
    title: "AgiMate"
    category: "cloud-agent"
    user-agent: "AgiMate managed agent (agimate.io)"
  tool:
    # Бюджет ожидания результата одного тул-вызова; таймаут НЕ отменяет джобу на бэке.
    poll-timeout: 60s
    # Потолок вывода одного тула (в символах); длиннее — обрезается с явной пометкой.
    max-output-chars: 64000
  response:
    # Language of user-facing notices; BCP-47 tag. Bundled: en (default), ru.
    language: "en"
  net:
    # SSRF-guard провайдерского base_url: разрешать ли приватные/loopback/link-local адреса.
    # В проде false — тогда же требуется https, потому что проверка адреса у этого клиента
    # висит на TLS-сокете и по plain http не срабатывает. true — для локальных моделей.
    allow-private-targets: false
    # Дополнительные корни доверия для исходящего TLS (см. app.net.trusted-ca в control-api):
    # набор обязан совпадать, иначе провайдер перечислит модели и не ответит на сам вызов.
    trusted-ca: ""
    # HTTP-прокси для провайдеров, недоступных из сети установки (см. app.net.proxy в control-api):
    # пара обязана совпадать, иначе список моделей загрузится, а вызов получит 403.
    proxy:
      url: ""
      hosts: []
  dbos:
    app-name: "agent-worker"
    # Must address the same database as control-api's dbos.system-database.
    database-url: "jdbc:postgresql://localhost:5432/dbos"
    username: "agimate"
    password: "agimate_dev_password"
    schema: "dbos"
    application-version:
    # Сколько хранить завершённые воркфлоу (с чекпоинтами) в системной базе DBOS;
    # 0 отключает очистку. Бизнес-данные рана и так уходят в control-api синхронно.
    retention: 7d

