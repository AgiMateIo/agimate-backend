spring:
  application:
    name: agent-worker
  main:
    # Headless worker: no embedded web server.
    web-application-type: none
    banner-mode: off
  profiles:
    active: "local"
  messages:
    # Unknown agent.response.language falls back to the base bundle (English), not the JVM locale.
    fallback-to-system-locale: false

logging:
  level:
    root: INFO
    # INFO = the clean per-run story (start → context → turns → answer → finish).
    # Flip to DEBUG for the full trace: credentials/model, tool names, per-progress sends, gRPC retries.
    ru.agimate.agentworker: INFO

# Worker configuration. Values here are defaults; override any of them via
# environment variables (relaxed binding), e.g. AGENT_GRPC_TARGET, AGENT_DBOS_DATABASE_URL.
agent:
  grpc:
    target: "localhost:9091"
    use-tls: false
    ca-cert:
    auth-token: ""
    request-timeout: 10s
    connect-timeout: 5s
  agent:
    id: "agent-default"
    workflow-id: "wf-default"
    # Кап ходов агентного цикла на ран (1 ход = 1 LLM-вызов); у капа — мягкая посадка
    # (wrap-up-нотис + финальный ход без тулов), а не жёсткий обрыв.
    max-turns: 30
  concurrency:
    llm: 3
    tool: 8
  app:
    url: "https://agimate.io"
    title: "AgiMate"
    category: "cloud-agent"
    user-agent: "AgiMate managed agent (agimate.io)"
  tool:
    # Бюджет ожидания результата одного тул-вызова; таймаут НЕ отменяет джобу на бэке.
    poll-timeout: 60s
    # Потолок вывода одного тула (в символах); длиннее — обрезается с явной пометкой.
    max-output-chars: 64000
  response:
    # Language of user-facing notices; BCP-47 tag. Bundled: en (default), ru.
    language: "en"
  dbos:
    app-name: "agent-worker"
    # Must address the same database as control-api's dbos.system-database.
    database-url: "jdbc:postgresql://localhost:5432/dbos"
    username: "agimate"
    password: "agimate_dev_password"
    schema: "dbos"
    application-version:
    # Сколько хранить завершённые воркфлоу (с чекпоинтами) в системной базе DBOS;
    # 0 отключает очистку. Бизнес-данные рана и так уходят в control-api синхронно.
    retention: 7d

