# User-facing response notices (base = English; also the fallback for any unknown language).
# Russian override lives in messages_ru.properties. Selected by agent.response.language.
# Punctuation stays ASCII: an em dash reads as mojibake wherever .properties is opened as ISO-8859-1.
notice.max-turns=Sorry, I couldn't finish the response: the agent exceeded its step limit.
notice.model-error=Sorry, something went wrong while contacting the model. Please try again.
notice.auth-error=Sorry, I can't connect to the model. Check the API key settings.
notice.no-model=Sorry, I can't answer: no LLM model is set up for this agent (or the selected one is unavailable). Connect a provider and pick a model in the agent's settings.
notice.cancelled=Stopped at your request.
notice.cancelled-did-run=Managed to run:
notice.empty-answer=Sorry, the model returned an empty response. Please try again or rephrase the request.
notice.truncated=Sorry, the response didn't fit the length limit. Try a shorter request or split it into parts.
notice.filtered=Sorry, I can't respond to this message.
notice.infra-error=Sorry, an internal error occurred while processing the message. Please try again a bit later.

# Model-facing prompt text (not shown to the user). Same bundle, different reader: it rides into the
# conversation, so it must be in a language the model answers the user in.
prompt.wrap-up=The run is almost out of steps: no more than two turns remain. Wrap up now: give the user a final answer from what is already done (attach the files and results you have), and state plainly what you did not get to. Call a tool only if the answer is impossible without it.
