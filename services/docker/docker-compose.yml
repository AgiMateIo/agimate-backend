version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: agimate-postgres
    environment:
      POSTGRES_USER: agimate
      POSTGRES_PASSWORD: agimate_dev_password
      POSTGRES_MULTIPLE_DATABASES: am_core_db,am_control_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agimate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agimate-network

  # Centrifugo for real-time messaging (used by control-api)
  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: agimate-centrifugo
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo-config.json:/centrifugo/config.json
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agimate-network

  # User API Service
  user-api:
    build:
      context: ..
      dockerfile: user-api/Dockerfile
    container_name: agimate-user-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/am_core_db
      SPRING_DATASOURCE_USERNAME: agimate
      SPRING_DATASOURCE_PASSWORD: agimate_dev_password
      JWT_PRIVATEKEY: ${JWT_PRIVATEKEY}
      JWT_PUBLICKEY: ${JWT_PUBLICKEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - agimate-network
    restart: unless-stopped

  # Control API Service
  control-api:
    build:
      context: ..
      dockerfile: control-api/Dockerfile
    container_name: agimate-control-api
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/am_control_db
      SPRING_DATASOURCE_USERNAME: agimate
      SPRING_DATASOURCE_PASSWORD: agimate_dev_password
      JWT_PUBLICKEY: ${JWT_PUBLICKEY}
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_APIKEY: ${CENTRIFUGO_APIKEY:-dev_api_key}
    ports:
      - "8081:8080"
    networks:
      - agimate-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  agimate-network:
    driver: bridge
