version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: agimate-postgres
    environment:
      POSTGRES_USER: agimate
      POSTGRES_PASSWORD: agimate_dev_password
      POSTGRES_MULTIPLE_DATABASES: am_core_db,am_mobile_db,am_connectors_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agimate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agimate-network

  # Centrifugo for real-time messaging (used by mobile-api)
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: agimate-centrifugo
    command: centrifugo --config=/centrifugo/config.json
    ports:
      - "8000:8000"  # HTTP API
      - "8001:8001"  # WebSocket
    volumes:
      - ./centrifugo-config.json:/centrifugo/config.json
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agimate-network

  # User API Service
  user-api:
    build:
      context: ..
      dockerfile: user-api/Dockerfile
    container_name: agimate-user-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/am_core_db
      SPRING_DATASOURCE_USERNAME: agimate
      SPRING_DATASOURCE_PASSWORD: agimate_dev_password
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - agimate-network
    restart: unless-stopped

  # Mobile API Service
  mobile-api:
    build:
      context: ..
      dockerfile: mobile-api/Dockerfile
    container_name: agimate-mobile-api
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/am_mobile_db
      SPRING_DATASOURCE_USERNAME: agimate
      SPRING_DATASOURCE_PASSWORD: agimate_dev_password
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev_api_key}
    ports:
      - "8081:8080"
    networks:
      - agimate-network
    restart: unless-stopped

  # Connectors API Service
  connectors-api:
    build:
      context: ..
      dockerfile: connectors-api/Dockerfile
    container_name: agimate-connectors-api
    depends_on:
      postgres:
        condition: service_healthy
      mobile-api:
        condition: service_started
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/am_connectors_db
      SPRING_DATASOURCE_USERNAME: agimate
      SPRING_DATASOURCE_PASSWORD: agimate_dev_password
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CONNECTORS_ENCRYPTION_KEY: ${CONNECTORS_ENCRYPTION_KEY}
      MOBILE_API_GRPC_HOST: mobile-api
      MOBILE_API_GRPC_PORT: 9090
    ports:
      - "8280:8280"
      - "8288:8288"
    networks:
      - agimate-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  agimate-network:
    driver: bridge
