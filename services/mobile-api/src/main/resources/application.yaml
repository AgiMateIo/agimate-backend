server:
  port: 8080
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
  max-http-request-header-size: 60KB
  servlet:
    context-path: "/mobile-api"

management:
  server:
    port: 8088

spring:
  application:
    name: "mobile-api"
  profiles:
    active: "local"
  main:
    banner-mode: off
    lazy-initialization: false
  mvc:
    throw-exception-if-no-handler-found: true
    publish-request-handled-events: false
  web:
    resources:
      add-mappings: false
    error:
      whitelabel:
        enabled: false
      path: "/error"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/am_mobile_db?reWriteBatchedInserts=true"
    username: "user"
    password: "password"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000  # 2min
      max-lifetime: 240000  # 4min
      keepalive-time: 30000 # 30sec
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  grpc:
    server:
      port: 9090

micrometer:
  observations:
    annotations:
      enabled: true

logging:
  level:
    root: warn
    org.springframework.boot.web: debug # to write opened port
    ru.agimate: debug

springdoc:
  swagger-ui:
    path: "/docs/ui"
    url: "/docs/api"
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    groups-order: asc
    enabled: false
  api-docs:
    path: "/docs/api"
    enabled: false
  paths-to-exclude: "/favicon.ico"

jwt:
  privateKey: ""
  publicKey: "***REMOVED***"
  accessExpiration: 86400
  refreshExpiration: 604800

centrifugo:
  enabled: true
  url: "http://localhost"
  port: 9000
  api-key: ""
  privateKey: ""
  publicKey: ""

mobile-api:
  security:
    api-keys:
      - name: "mobile-device-1"
        key: ${MOBILE_API_KEY_1:dev-api-key-1}