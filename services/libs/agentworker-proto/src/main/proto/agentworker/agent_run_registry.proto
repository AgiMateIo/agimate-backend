syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "AgentRunRegistryProto";

// Active-run registry (протокол v2), backed by the trigger_log_agents table.
//
// Воркер оперирует только trigger_id (= trigger_log_agents.id = runId = DBOS workflow id);
// сессию single-writer'а резолвит бэк и возвращает как session_key — партиционный ключ
// очереди agent_exec (concurrency=1 на партицию сериализует раны сессии).
//
// Инвариант: не больше одного RUNNING-рана на session (partial unique index). BUSY —
// обычный исход (слот держит незавершённый ран; после смерти держателя его вычищает
// server-side eviction по TTL/статусу DBOS-workflow).
service AgentRunRegistry {
  rpc RegisterRun (RegisterRunRequest) returns (RegisterRunResponse);
  rpc ReleaseRun (ReleaseRunRequest) returns (ReleaseRunResponse);
}

enum RunSlotStatus {
  RUN_SLOT_STATUS_UNSPECIFIED = 0;
  RUN_SLOT_STATUS_ACQUIRED = 1;   // слот взят (или идемпотентный re-affirm своим же раном)
  RUN_SLOT_STATUS_BUSY = 2;       // слот держит другой ран
  RUN_SLOT_STATUS_NO_SESSION = 3; // direct-ран без сессии: сериализовать нечего
}

message RegisterRunRequest {
  string agent_id = 1;
  string trigger_id = 2;  // trigger_log_agents.id (= DBOS workflow id рана)
  int32 ttl_seconds = 3;  // server default if 0 (~3600)
}

message RegisterRunResponse {
  RunSlotStatus status = 1;
  // Ключ сериализации ранов (sessionId строкой); пуст при NO_SESSION. Роутер использует его
  // как partition key очереди agent_exec.
  string session_key = 2;
}

message ReleaseRunRequest {
  string agent_id = 1;
  string trigger_id = 2;
}

message ReleaseRunResponse {
  bool released = 1;
}
