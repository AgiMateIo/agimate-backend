syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "AgentContextProto";

import "agentworker/message_log.proto";

service AgentContext {
  // Весь контекст рана одним вызовом: упорядоченные блоки промпта + отскоупленные тулы.
  // Политика сборки (ContextSpec: скоуп скиллов/тулов, guidance) — целиком на бэке; воркер
  // только рендерит блоки в присланном порядке. trigger_id = trigger_log_agents.id = runId.
  rpc GetRunContext(GetRunContextRequest) returns (RunContext);
  // Намеренно отдельно от GetRunContext: его результат воркер чекпоинтит (durable step
  // prepare_context), api_key в чекпоинт попадать не должен — креды запрашиваются inline
  // на каждый llm_call.
  rpc GetLlmCredentials(GetLlmCredentialsRequest) returns (LlmCredentials);
}

message GetRunContextRequest {
  string agent_id = 1;
  string trigger_id = 2;  // trigger_log_agents.id (= DBOS workflow id рана)
}

// Блок промпта: content без тегов/обёртки — XML-тег {name attrs} ставит рендерер воркера.
message PromptBlock {
  string name = 1;                  // имя тега, snake_case
  string source = 2;                // происхождение: agent | team | skill | guidance | connector:<code>
  string content = 3;
  map<string, string> attrs = 4;    // атрибуты тега (например версия памяти)
  bool trusted = 5;                 // false (только user-блоки) → рендерер оборачивает как untrusted data
  bool ephemeral = 6;               // true → в историю сессии не персистится (например memory notes)
}

message RunContext {
  // Порядок блоков — контракт: бэк кладёт стабильные первыми (prompt-cache),
  // воркер рендерит как есть и не пересортировывает.
  repeated PromptBlock system_blocks = 1;
  // Основной промпт рана (текст диалога / data триггера) — тоже user-блок, идёт последним.
  repeated PromptBlock user_blocks = 2;
  // Уже отскоупленные скиллами и прошедшие ABAC-гейт binding'ов.
  repeated ConnectorToolSpec tools = 3;
  // История сессии «как видел пользователь»: только завершённые раны (completed=true),
  // отфильтрована по historyDetail пресета ContextSpec, окно на бэке. Пусто для direct-ранов.
  repeated HistoryMessage history = 4;
}

message GetLlmCredentialsRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message LlmCredentials {
  string provider_type = 1;
  string base_url = 2;
  string api_key = 3;
  string model = 4;
}

// MCP ToolAnnotations — поведенческие хинты тула.
message ToolAnnotations {
  bool read_only_hint = 1 [json_name = "readOnlyHint"];
  bool destructive_hint = 2 [json_name = "destructiveHint"];
  bool idempotent_hint = 3 [json_name = "idempotentHint"];
  bool open_world_hint = 4 [json_name = "openWorldHint"];
}

// MCP-совместимое описание тула (соответствует ConnectorToolSpec в control-api).
message ConnectorToolSpec {
  string name = 1;
  string title = 2;
  string description = 3;
  bytes input_schema = 4 [json_name = "inputSchema"];    // MCP inputSchema (JSON Schema)
  bytes output_schema = 5 [json_name = "outputSchema"];  // MCP outputSchema (JSON Schema)
  ToolAnnotations annotations = 6;                       // MCP annotations
  map<string, string> meta = 7 [json_name = "_meta"];    // MCP _meta
  // Экземпляр коннектора, которому принадлежит тул (= connections.id, как connection_id на ExecuteTool).
  string connection_id = 8 [json_name = "connectionId"];
  // Неймспейс экземпляра для LLM-имени (connector_code для синглтонов, full_code для инстансов).
  // Воркер строит LLM-имя тула как {namespace}.{name} для глобальной уникальности; на ExecuteTool
  // возвращает исходные (connector_code, connection_id, name) — маршрутизация по wire не меняется.
  string namespace = 9 [json_name = "namespace"];
  // Тип коннектора — для маршрутизации ExecuteTool (раньше приходил из GetConnections).
  string connector_code = 10 [json_name = "connectorCode"];
}
