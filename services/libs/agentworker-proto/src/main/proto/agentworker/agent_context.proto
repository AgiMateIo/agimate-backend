syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "AgentContextProto";

import "agentworker/message_log.proto";

service AgentContext {
  // Весь контекст рана одним вызовом: упорядоченные блоки промпта + отскоупленные тулы.
  // Политика сборки (ContextSpec: скоуп скиллов/тулов, guidance) — целиком на бэке; воркер
  // только рендерит блоки в присланном порядке. trigger_id = trigger_log_agents.id = runId.
  rpc GetRunContext(GetRunContextRequest) returns (RunContext);
  // Намеренно отдельно от GetRunContext: его результат воркер чекпоинтит (durable step
  // prepare_context), api_key в чекпоинт попадать не должен — креды запрашиваются inline
  // на каждый llm_call.
  rpc GetLlmCredentials(GetLlmCredentialsRequest) returns (LlmCredentials);
  // Учёт расхода токенов: best-effort репорт воркера после каждого успешного LLM-вызова.
  // Идемпотентен по call_id (DBOS workflow id LLM-вызова) — повтор возвращает duplicate=true.
  rpc ReportLlmUsage(ReportLlmUsageRequest) returns (ReportLlmUsageResponse);
  // Содержимое inbound-вложения (изображение и т.п.) чанками. Как api_key — тянется inline
  // при llm_call и в DBOS-чекпоинт не попадает; RunContext несёт только ссылки (FilePart).
  // Ownership-гейт по agent_id: file.user_id == agent.user_id, иначе NOT_FOUND.
  rpc GetFile(GetFileRequest) returns (stream FileChunk);
}

message GetRunContextRequest {
  string agent_id = 1;
  string trigger_id = 2;  // trigger_log_agents.id (= DBOS workflow id рана)
}

// Блок промпта: content без тегов/обёртки — XML-тег {name attrs} ставит рендерер воркера.
message PromptBlock {
  string name = 1;                  // имя тега, snake_case
  string source = 2;                // происхождение: agent | team | skill | guidance | connector:<code>
  string content = 3;
  map<string, string> attrs = 4;    // атрибуты тега (например версия памяти)
  bool trusted = 5;                 // false (только user-блоки) → рендерер оборачивает как untrusted data
  bool ephemeral = 6;               // true → в историю сессии не персистится (например memory notes)
}

message RunContext {
  // Порядок блоков — контракт: бэк кладёт стабильные первыми (prompt-cache),
  // воркер рендерит как есть и не пересортировывает.
  repeated PromptBlock system_blocks = 1;
  // Основной промпт рана (текст диалога / data триггера) — тоже user-блок, идёт последним.
  repeated PromptBlock user_blocks = 2;
  // Уже отскоупленные скиллами и прошедшие ABAC-гейт binding'ов.
  repeated ConnectorToolSpec tools = 3;
  // История сессии «как видел пользователь»: только завершённые раны (completed=true),
  // отфильтрована по historyDetail пресета ContextSpec, окно на бэке. Пусто для direct-ранов.
  repeated HistoryMessage history = 4;
  // Вложения диалогового inbound текущего рана — только ссылки; байты воркер тянет GetFile'ом.
  // Пусто вне DIALOGUE-контекста и у старого control-api (rolling deploy) — воркер работает
  // как текстовый. В историю не попадают (плейсхолдер — в тексте user-блока).
  repeated FilePart inbound_parts = 5;
}

// Ссылка на inbound-вложение (без байтов). type ведёт мультимодальность воркера: image идёт
// в LLM как Media, прочее — текстовым стабом (агент может переслать attach-конвенцией).
message FilePart {
  string file_id = 1;   // agf_<uuid>
  string type = 2;      // image | video | audio | file
  string mime = 3;
  int64 size = 4;
  string name = 5;      // имя файла, если известно (Telegram document); иначе пусто
}

message GetFileRequest {
  string file_id = 1;   // agf_<uuid>
  string agent_id = 2;  // ownership-гейт: file.user_id == agent.user_id
}

// Первый чанк несёт mime и total_size; последующие — только data. Чанки ~128 KB, чтобы не
// упираться в дефолтный 4 MB предел gRPC-сообщения.
message FileChunk {
  bytes data = 1;
  string mime = 2;
  int64 total_size = 3;
}

message GetLlmCredentialsRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message LlmCredentials {
  string provider_type = 1;
  string base_url = 2;
  string api_key = 3;
  string model = 4;
  // llm_providers.id — воркер возвращает его эхом в ReportLlmUsage, чтобы бэк не
  // переразрешал привязку задним числом. Пусто у старого control-api (rolling deploy) —
  // тогда воркер репорт пропускает.
  string provider_id = 5;
  // JSON-объект доп. полей тела chat/completions (deep-merge провайдер- и пер-модельного
  // extra_body уже выполнен бэком; напр. OpenRouter provider-роутинг). Пусто = нет доп. полей
  // (в т.ч. у старого control-api при rolling deploy). НЕ секрет, но целиком в логи не писать.
  string extra_body_json = 6;
  // input_modalities модели из реестра бэка (llm_provider_models, с write-time фолбэком
  // llm_model_defaults): "text", "image", "audio", … Пусто = неизвестно (модели нет в реестре /
  // старый control-api) — воркер ведёт себя оптимистично (прикладывает image-вложения инлайном).
  repeated string input_modalities = 7 [json_name = "inputModalities"];
}

message ReportLlmUsageRequest {
  string call_id = 1;             // DBOS workflow id LLM-вызова — ключ идемпотентности
  string agent_id = 2;
  string run_id = 3;              // trigger_log_agents.id (parent workflow), пусто если неизвестен
  string provider_id = 4;         // эхо LlmCredentials.provider_id
  string model = 5;
  int32 input_tokens = 6;
  int32 output_tokens = 7;
  int32 cache_read_tokens = 8;
  int32 cache_write_tokens = 9;
}

message ReportLlmUsageResponse {
  bool duplicate = 1;             // call_id уже учтён (реплей/повтор) — инкрементов не было
}

// MCP ToolAnnotations — поведенческие хинты тула.
message ToolAnnotations {
  bool read_only_hint = 1 [json_name = "readOnlyHint"];
  bool destructive_hint = 2 [json_name = "destructiveHint"];
  bool idempotent_hint = 3 [json_name = "idempotentHint"];
  bool open_world_hint = 4 [json_name = "openWorldHint"];
}

// MCP-совместимое описание тула (соответствует ConnectorToolSpec в control-api).
message ConnectorToolSpec {
  string name = 1;
  string title = 2;
  string description = 3;
  bytes input_schema = 4 [json_name = "inputSchema"];    // MCP inputSchema (JSON Schema)
  bytes output_schema = 5 [json_name = "outputSchema"];  // MCP outputSchema (JSON Schema)
  ToolAnnotations annotations = 6;                       // MCP annotations
  map<string, string> meta = 7 [json_name = "_meta"];    // MCP _meta
  // Экземпляр коннектора, которому принадлежит тул (= connections.id, как connection_id на ExecuteTool).
  string connection_id = 8 [json_name = "connectionId"];
  // Неймспейс экземпляра для LLM-имени (connector_code для синглтонов, full_code для инстансов).
  // Воркер строит LLM-имя тула как {namespace}.{name} для глобальной уникальности; на ExecuteTool
  // возвращает исходные (connector_code, connection_id, name) — маршрутизация по wire не меняется.
  string namespace = 9 [json_name = "namespace"];
  // Тип коннектора — для маршрутизации ExecuteTool (раньше приходил из GetConnections).
  string connector_code = 10 [json_name = "connectorCode"];
  // Бюджет ожидания результата тула воркером, секунды. 0 — дефолт воркера
  // (agent.tool.poll-timeout); воркер клампит значение сверху (30 мин).
  uint32 timeout_seconds = 11 [json_name = "timeoutSeconds"];
}
