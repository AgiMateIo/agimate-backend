syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "AgentContextProto";

import "agentworker/message_log.proto";

service AgentContext {
  // The whole run context in one call: ordered prompt blocks + scoped tools. Assembly policy
  // (ContextSpec: skill/tool scope, guidance) lives entirely on the backend; the worker only
  // renders the blocks in the order given. run_id = agent_runs.id.
  rpc GetRunContext(GetRunContextRequest) returns (RunContext);
  // Deliberately separate from GetRunContext: the worker checkpoints that result (durable step
  // prepare_context), and api_key must never enter a checkpoint — credentials are fetched inline
  // on every llm_call.
  rpc GetLlmCredentials(GetLlmCredentialsRequest) returns (LlmCredentials);
  // Token accounting: best-effort report from the worker after each successful LLM call.
  // Idempotent by call_id (the DBOS workflow id of the LLM call) — a repeat returns duplicate=true.
  rpc ReportLlmUsage(ReportLlmUsageRequest) returns (ReportLlmUsageResponse);
  // Contents of an inbound attachment (image and the like), chunked. Like api_key, it is pulled
  // inline during llm_call and never enters a DBOS checkpoint; RunContext carries references only
  // (FilePart). Ownership gate by agent_id: file.user_id == agent.user_id, otherwise NOT_FOUND.
  rpc GetFile(GetFileRequest) returns (stream FileChunk);
}

message GetRunContextRequest {
  string agent_id = 1;
  string run_id = 2;  // agent_runs.id (= the run's DBOS workflow id)
}

// A prompt block: content carries no tags or wrapper — the worker's renderer adds the XML tag
// {name attrs}.
message PromptBlock {
  string name = 1;                  // tag name, snake_case
  string source = 2;                // origin: agent | team | skill | guidance | connector:<code>
  string content = 3;
  map<string, string> attrs = 4;    // tag attributes (e.g. memory version)
  bool trusted = 5;                 // false (user blocks only) → the renderer wraps it as untrusted data
  bool ephemeral = 6;               // true → not persisted into session history (e.g. memory notes)
}

message RunContext {
  // Block order is part of the contract: the backend puts the stable ones first (prompt cache),
  // and the worker renders them as-is without re-sorting.
  repeated PromptBlock system_blocks = 1;
  // The run's main prompt (dialogue text / trigger data) — also a user block, and it goes last.
  repeated PromptBlock user_blocks = 2;
  // Already scoped by skills and past the ABAC gate on bindings.
  repeated ConnectorToolSpec tools = 3;
  // Session history, assembled on the backend from the canonical turn ledger (agent_run_turns):
  // finished runs whose ledger is intact, a window counted in runs, filtered by the ContextSpec
  // preset's history parts. Empty for direct runs.
  repeated HistoryMessage history = 4;
  // Attachments of this run's dialogue inbound — references only; the worker pulls the bytes with
  // GetFile. Empty outside a DIALOGUE context and against an older control-api (rolling deploy) —
  // the worker then behaves as text-only. These never reach history (the text of the user block
  // carries a placeholder instead).
  repeated FilePart inbound_parts = 5;
}

// A reference to an inbound attachment (no bytes). type drives the worker's multimodality: image
// goes to the LLM as Media, anything else as a text stub (the agent can forward it using the
// attach convention).
message FilePart {
  string file_id = 1;   // agf_<uuid>
  string type = 2;      // image | video | audio | file
  string mime = 3;
  int64 size = 4;
  string name = 5;      // file name when known (Telegram document), otherwise empty
}

message GetFileRequest {
  string file_id = 1;   // agf_<uuid>
  string agent_id = 2;  // ownership gate: file.user_id == agent.user_id
}

// The first chunk carries mime and total_size; the rest carry data only. Chunks are ~128 KB so as
// not to hit gRPC's default 4 MB message limit.
message FileChunk {
  bytes data = 1;
  string mime = 2;
  int64 total_size = 3;
}

message GetLlmCredentialsRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message LlmCredentials {
  string provider_type = 1;
  string base_url = 2;
  string api_key = 3;
  string model = 4;
  // llm_providers.id — the worker echoes it back in ReportLlmUsage so the backend does not have to
  // re-resolve the binding after the fact. Empty against an older control-api (rolling deploy) —
  // the worker then skips the report.
  string provider_id = 5;
  // JSON object of extra chat/completions body fields (the deep merge of provider- and per-model
  // extra_body is already done by the backend; e.g. OpenRouter provider routing). Empty = no extra
  // fields (including against an older control-api during a rolling deploy). NOT a secret, but do
  // not log it in full.
  string extra_body_json = 6;
  // The model's input_modalities from the backend registry (llm_provider_models, with a write-time
  // fallback to llm_model_defaults): "text", "image", "audio", … Empty = unknown (model absent from
  // the registry / older control-api) — the worker then behaves optimistically and attaches image
  // parts inline.
  repeated string input_modalities = 7 [json_name = "inputModalities"];
}

message ReportLlmUsageRequest {
  string call_id = 1;             // the LLM call's DBOS workflow id — the idempotency key
  string agent_id = 2;
  string run_id = 3;              // agent_runs.id (parent workflow), empty if unknown
  string provider_id = 4;         // echo of LlmCredentials.provider_id
  string model = 5;
  int32 input_tokens = 6;
  int32 output_tokens = 7;
  int32 cache_read_tokens = 8;
  int32 cache_write_tokens = 9;
}

message ReportLlmUsageResponse {
  bool duplicate = 1;             // call_id was already accounted for (replay/retry) — nothing was incremented
}

// MCP ToolAnnotations — behavioural hints for a tool.
message ToolAnnotations {
  bool read_only_hint = 1 [json_name = "readOnlyHint"];
  bool destructive_hint = 2 [json_name = "destructiveHint"];
  bool idempotent_hint = 3 [json_name = "idempotentHint"];
  bool open_world_hint = 4 [json_name = "openWorldHint"];
}

// MCP-compatible tool description (mirrors ConnectorToolSpec in control-api).
message ConnectorToolSpec {
  string name = 1;
  string title = 2;
  string description = 3;
  bytes input_schema = 4 [json_name = "inputSchema"];    // MCP inputSchema (JSON Schema)
  bytes output_schema = 5 [json_name = "outputSchema"];  // MCP outputSchema (JSON Schema)
  ToolAnnotations annotations = 6;                       // MCP annotations
  map<string, string> meta = 7 [json_name = "_meta"];    // MCP _meta
  // The connector instance owning the tool (= connections.id, same as connection_id on ExecuteTool).
  string connection_id = 8 [json_name = "connectionId"];
  // The instance's namespace for the LLM-facing name (connector_code for singletons, full_code for
  // instances). The worker builds the LLM tool name as {namespace}.{name} for global uniqueness; on
  // ExecuteTool it sends back the original (connector_code, connection_id, name) — wire routing is
  // unchanged.
  string namespace = 9 [json_name = "namespace"];
  // Connector type — used to route ExecuteTool (it used to arrive from GetConnections).
  string connector_code = 10 [json_name = "connectorCode"];
  // The worker's budget for awaiting the tool result, in seconds. 0 — the worker's default
  // (agent.tool.poll-timeout); the worker clamps the value from above (30 min).
  uint32 timeout_seconds = 11 [json_name = "timeoutSeconds"];
}
