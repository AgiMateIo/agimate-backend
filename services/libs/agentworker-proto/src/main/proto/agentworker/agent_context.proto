syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "AgentContextProto";

service AgentContext {
  rpc GetAgentSpec(GetAgentSpecRequest) returns (AgentSpec);
  rpc GetSkills(GetSkillsRequest) returns (GetSkillsResponse);
  rpc GetSkill(GetSkillRequest) returns (SkillSpec);
  rpc GetTeamContext(GetTeamContextRequest) returns (TeamContext);
  rpc GetLlmCredentials(GetLlmCredentialsRequest) returns (LlmCredentials);
  // Коннекторы, доступные агенту (binding'и agent_connections → connections). Воркер итерирует
  // их и по каждому зовёт GetConnectionTools, чтобы собрать набор тулов.
  rpc GetConnections(GetConnectionsRequest) returns (GetConnectionsResponse);
  // Все тулы одного экземпляра коннектора (connections.id). ABAC доступности уже применён в
  // GetConnections (вернулись только привязанные); пер-тул DENY-политики проверяются на ExecuteTool.
  rpc GetConnectionTools(GetConnectionToolsRequest) returns (GetConnectionToolsResponse);
  // persist-memory: свёрнутая (cold) память и ещё не сконсолидированные заметки (hot) агента —
  // воркер подмешивает их в системный промпт / запрос пользователя без вызова get_* тулов.
  rpc GetMemory(GetMemoryRequest) returns (AgentMemory);
  rpc GetMemoryNotes(GetMemoryNotesRequest) returns (GetMemoryNotesResponse);
}

message GetAgentSpecRequest {
  string workflow_id = 1;
  string agent_id = 2;
  string agent_version = 3;
}

message AgentSpec {
  string agent_id = 1;
  string name = 2;
  string agent_type = 3;
  string system_prompt = 4;
  string team_id = 5;
}

message GetSkillsRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message SkillRef {
  string skill_id = 1;
  string name = 2;
  string description = 3;
  // Коды коннекторов, которые требует скилл (mcp, telegram, time, board, persist-memory, ...).
  repeated string connector_codes = 4 [json_name = "connectorCodes"];
}

message GetSkillsResponse {
  repeated SkillRef skills = 1;
}

message GetSkillRequest {
  string workflow_id = 1;
  string skill_id = 2;
  string version = 3;
}

message SkillSpec {
  string skill_id = 1;
  string version = 2;
  string name = 3;
  string description = 4;
  bytes definition_json = 5;
  string skill_md = 6;
}

message GetTeamContextRequest {
  string workflow_id = 1;
  string team_id = 2;
}

message TeamMember {
  string pub_id = 1;
  string name = 2;
  string description = 3;
}

message TeamContext {
  string team_id = 1;
  string name = 2;
  string description = 3;
  repeated TeamMember members = 4;
}

message GetLlmCredentialsRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message LlmCredentials {
  string provider_type = 1;
  string base_url = 2;
  string api_key = 3;
  string model = 4;
}

message GetConnectionsRequest {
  string agent_id = 1;
}

// Экземпляр коннектора, доступный агенту.
message ConnectionRef {
  string id = 1;              // connections.id (= connection_id на ExecuteTool / GetConnectionTools)
  string connector_code = 2;  // тип коннектора (mcp, telegram, persist-memory, ...)
  // Префикс LLM-имени: connector_code для синглтонов (time/board/persist-memory),
  // full_code для инстансов (mcp_context7, telegram_<bot>). Воркер строит {namespace}.{name}.
  string namespace = 3 [json_name = "namespace"];
  string name = 4;            // человекочитаемое имя
}

message GetConnectionsResponse {
  repeated ConnectionRef connections = 1;
}

message GetConnectionToolsRequest {
  string connection_id = 1 [json_name = "connectionId"];  // connections.id
}

message GetConnectionToolsResponse {
  repeated ConnectorToolSpec tools = 1;
}

// MCP ToolAnnotations — поведенческие хинты тула.
message ToolAnnotations {
  bool read_only_hint = 1 [json_name = "readOnlyHint"];
  bool destructive_hint = 2 [json_name = "destructiveHint"];
  bool idempotent_hint = 3 [json_name = "idempotentHint"];
  bool open_world_hint = 4 [json_name = "openWorldHint"];
}

// MCP-совместимое описание тула (соответствует ConnectorToolSpec в control-api).
message ConnectorToolSpec {
  string name = 1;
  string title = 2;
  string description = 3;
  bytes input_schema = 4 [json_name = "inputSchema"];    // MCP inputSchema (JSON Schema)
  bytes output_schema = 5 [json_name = "outputSchema"];  // MCP outputSchema (JSON Schema)
  ToolAnnotations annotations = 6;                       // MCP annotations
  map<string, string> meta = 7 [json_name = "_meta"];    // MCP _meta
  // Экземпляр коннектора, которому принадлежит тул (= connections.id, как connection_id на ExecuteTool).
  string connection_id = 8 [json_name = "connectionId"];
  // Неймспейс экземпляра для LLM-имени (connector_code для синглтонов, full_code для инстансов).
  // Воркер строит LLM-имя тула как {namespace}.{name} для глобальной уникальности; на ExecuteTool
  // возвращает исходные (connector_code, connection_id, name) — маршрутизация по wire не меняется.
  string namespace = 9 [json_name = "namespace"];
}

message GetMemoryRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

// Свёрнутая (cold) память агента. version — для оптимистической записи через update_memory.
message AgentMemory {
  string content = 1;
  int32 version = 2;
}

message GetMemoryNotesRequest {
  string workflow_id = 1;
  string agent_id = 2;
}

message MemoryNote {
  string id = 1;
  string content = 2;
  string session_id = 3;
}

message GetMemoryNotesResponse {
  repeated MemoryNote notes = 1;
}
