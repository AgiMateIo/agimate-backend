syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "ToolGatewayProto";

// Tools are executed by the backend, not the worker: it owns the connector layer, the connection
// credentials and ABAC. Hence the split into two calls — a tool can run for minutes, and holding a
// gRPC thread for that long is not an option. Dispatch is asynchronous: the ack comes back
// immediately and the worker collects the result by polling (PENDING → SUCCESS/ERROR).
service ToolGateway {
  // Submits the call for execution. The ack means «accepted», not «done».
  rpc ExecuteToolAsync(ExecuteToolRequest) returns (ExecuteToolAsyncAck);
  // Polls for the result by the tool_call_id returned in the ack.
  rpc GetToolResult(GetToolResultRequest) returns (GetToolResultResponse);
  // The worker stops waiting for a slow call: from now on the backend owns the result and delivers
  // it back as a trigger (a new run in the call's session). The response settles the race with a
  // call that finished meanwhile: DETACHED — detached, the interim goes to the model; SUCCESS/ERROR —
  // already finished, here is the result, no trigger will fire. Idempotent for replays: once
  // detached, always DETACHED.
  rpc DetachTool(DetachToolRequest) returns (DetachToolResponse);
}

message ExecuteToolRequest {
  // The idempotency key, minted by the worker itself — never the id the provider put on the tool
  // call, which some OpenAI-compatible servers number positionally and restart every response. A
  // repeat with the same id and the same input finishes the earlier call instead of executing a
  // second one; the same id with a different input is a conflict.
  string tool_call_id = 1;
  string connector_code = 2;
  string connection_id = 3 [json_name = "connectionId"];
  string tool_name = 4;
  bytes input = 5;  // tool arguments, JSON: the connector knows the schema, the protocol does not type it
  string agent_id = 6;
  string workflow_id = 7;
  // The run the call originates from (agent_runs.id); the backend resolves the session/channel for
  // the tools' domain context itself, from the run's snapshot.
  string run_id = 8;
}

message ExecuteToolAsyncAck {
  string tool_call_id = 1;  // echo of the one sent: polling uses the same value
}

message GetToolResultRequest {
  string agent_id = 1;
  string tool_call_id = 2;
  // The run the call originates from: a poll doubles as a sign of life for the run (it extends
  // last_activity_at).
  string run_id = 3;
}

message GetToolResultResponse {
  ToolResultStatus status = 1;
  bytes output_json = 2;  // populated on SUCCESS only
  string error = 3;       // populated on ERROR only; the text reaches the model as the tool's result
}

message DetachToolRequest {
  string agent_id = 1;
  string tool_call_id = 2;
  // The run the call originates from: like a poll, a detach is a sign of life for the run.
  string run_id = 3;
}

// Same shape as GetToolResultResponse on purpose: a lost race comes back as the plain result.
message DetachToolResponse {
  ToolResultStatus status = 1;  // DETACHED, or SUCCESS/ERROR when the call finished first
  bytes output_json = 2;
  string error = 3;
}

enum ToolResultStatus {
  TOOL_RESULT_STATUS_UNSPECIFIED = 0;
  TOOL_RESULT_STATUS_PENDING = 1;  // still executing — keep polling, this is not a failure
  TOOL_RESULT_STATUS_SUCCESS = 2;
  TOOL_RESULT_STATUS_ERROR = 3;
  // The run was cancelled: stop polling. Says nothing about the call — one in flight is left to
  // finish and record its outcome, since a request that reached Telegram cannot be taken back.
  TOOL_RESULT_STATUS_CANCELLED = 4;
  // The call was detached: the result belongs to the trigger delivery, the worker writes the
  // interim marker. Terminal for the poll loop and stable across replays — GetToolResult keeps
  // answering DETACHED even after the call finishes, so a replayed seam records the same outcome.
  TOOL_RESULT_STATUS_DETACHED = 5;
}
