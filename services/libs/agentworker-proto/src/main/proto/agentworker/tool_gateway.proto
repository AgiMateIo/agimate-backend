syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "ToolGatewayProto";

service ToolGateway {
  rpc ExecuteToolAsync(ExecuteToolRequest) returns (ExecuteToolAsyncAck);
  rpc GetToolResult(GetToolResultRequest) returns (GetToolResultResponse);
}

message ExecuteToolRequest {
  string tool_call_id = 1;
  string connector_code = 2;
  string connection_id = 3 [json_name = "connectionId"];
  string tool_name = 4;
  bytes input = 5;
  string agent_id = 6;
  string workflow_id = 7;
  // Ран-источник вызова (trigger_log_agents.id); сессию/канал для доменного контекста
  // тулов бэк резолвит сам из снапшота рана.
  string run_id = 8;
}

message ExecuteToolAsyncAck {
  string tool_call_id = 1;
}

message GetToolResultRequest {
  string agent_id = 1;
  string tool_call_id = 2;
  // Ран-источник вызова: poll — признак жизни рана (продлевает last_activity_at).
  string run_id = 3;
}

message GetToolResultResponse {
  ToolResultStatus status = 1;
  bytes output_json = 2;
  string error = 3;
}

enum ToolResultStatus {
  TOOL_RESULT_STATUS_UNSPECIFIED = 0;
  TOOL_RESULT_STATUS_PENDING = 1;
  TOOL_RESULT_STATUS_SUCCESS = 2;
  TOOL_RESULT_STATUS_ERROR = 3;
}
