syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "ChannelGatewayProto";

service ChannelGateway {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc SendChannelMessage(SendChannelMessageRequest) returns (SendChannelMessageResponse);
}

message ListChannelsRequest {
  string agent_id = 1;
}

message ChannelDescriptor {
  string channel_id = 1;
  string name = 2;
  string connector_code = 3;   // коннектор, к которому привязан канал
  string identity = 4;         // identity коннектора (может быть пустым)
}

message ListChannelsResponse {
  repeated ChannelDescriptor channels = 1;
}

// Вложение мультимодального сообщения. Фаза 1 (текст) parts не использует.
message Part {
  string type = 1;
  string storage_ref = 2;
  string mime = 3;
  int64 size = 4;
  // Произвольные метаданные (имя файла, длительность, транскрипт ...) в виде JSON-объекта.
  string meta_json = 5;
}

// Унифицированный ответ модели — контент без адресации/корреляции (зеркало InboundMessage).
message OutboundMessage {
  string text = 1;
  repeated Part parts = 2;
}

message SendChannelMessageRequest {
  string agent_id = 1;
  string channel_id = 2;
  string session_id = 3;
  // Id исходящего сообщения от агента — ключ идемпотентности диспатча ответа. Может быть пустым.
  string message_id = 4;
  OutboundMessage message = 5;
  // Роль потока вывода агента: "progress" | "answer" | "error"; пустое = answer (старые воркеры).
  string stream = 6;
}

message SendChannelMessageResponse {
  string session_id = 1;
  // Эффективный message_id (присланный агентом или сгенерированный control-api).
  string message_id = 2;
}
