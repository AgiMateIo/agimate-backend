syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "MessageLogProto";

// The single record of dialogue events (protocol v2, stage 3): the worker is the only writer of
// history, and channel delivery is a projection of that record on the backend (routed by kind and
// by the channel snapshot of the route). Idempotency key is (run_id, seq): DBOS steps are
// at-least-once, so a retry yields neither a duplicate in history nor a second delivery
// (downstream dedup by a deterministic message_id).
service MessageLog {
  rpc SaveMessage(SaveMessageRequest) returns (SaveMessageResponse);
  // The canonical full-fidelity turn of a run (agent_run_turns): one record per worker
  // AgentChatMessage (assistant/tool), uncapped. Unlike SaveMessage this is not a durable step: a
  // turn is an idempotent projection of already-durable data (results of child LLM/tool workflows),
  // so a replay re-sends the same (run_id, turn_index) pair and the backend deduplicates. No
  // delivery.
  rpc SaveTurn(SaveTurnRequest) returns (SaveTurnResponse);
  // Snapshot of the run's starting prompt (agent_runs.prompt): the message list exactly as it went
  // into the first LLM call — system + history + trigger message (with the ephemeral prefix). Sent
  // once before the loop; subsequent turns go separately via SaveTurn. Not a durable step,
  // best-effort; the backend writes first-write-wins (a replay or retry does not overwrite).
  rpc SavePrompt(SavePromptRequest) returns (SavePromptResponse);
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_INBOUND = 1;   // «the agent received it» ack: text is empty, the backend takes the canonical form from trigger_log itself
  MESSAGE_KIND_PROGRESS = 2;  // intermediate output (thinking/tool/text), refined by progress_type
  MESSAGE_KIND_ANSWER = 3;    // the LLM's final answer; marks every message of the run completed=true
  MESSAGE_KIND_ERROR = 4;     // user-facing notice about a run failure
}

enum ProgressType {
  PROGRESS_TYPE_UNSPECIFIED = 0;
  PROGRESS_TYPE_THINKING = 1;
  PROGRESS_TYPE_TOOL_CALL = 2;    // a turn with calls: tool_turn carries calls only (no results yet)
  PROGRESS_TYPE_TEXT = 3;
  PROGRESS_TYPE_TOOL_RESULT = 4;  // results of that same turn (written after execution): tool_turn carries results only, text is empty → not delivered to the channel
}

message SaveMessageRequest {
  string agent_id = 1;
  string run_id = 2;        // agent_runs.id (= DBOS workflow id)
  int32 seq = 3;                // the run's monotonic counter (0 = inbound); the idempotency key
  MessageKind kind = 4;
  ProgressType progress_type = 5;  // for PROGRESS only
  string text = 6;              // empty for INBOUND
  // Structural record of a tool turn (protocol v2.1), split across two rows (v2.1a): under
  // PROGRESS/TOOL_CALL only calls (text is the 🔧 channel projection, delivered right away, before
  // execution), under PROGRESS/TOOL_RESULT only results (text empty, history-only). Into the
  // history of later runs the backend hands both back as a native tool_use/tool_result pair.
  ToolTurn tool_turn = 7;
}

message SaveMessageResponse {
  bool duplicate = 1;           // (run_id, seq) already written — a retry
  // The user asked this run to stop. Rides back on calls the worker already makes, so there is no
  // push channel; the seq 0 ack carries it too, which is how a run cancelled while queued never starts.
  bool cancelled = 2;
}

enum TurnRole {
  TURN_ROLE_UNSPECIFIED = 0;
  TURN_ROLE_SYSTEM = 1;
  TURN_ROLE_USER = 2;
  TURN_ROLE_ASSISTANT = 3;
  TURN_ROLE_TOOL = 4;
}

// One turn of the canonical journal. The schema mirrors the worker's AgentChatMessage: user carries
// text alone (turn_index 0, the inbound turn without the ephemeral prefix), assistant carries
// text/thinking_text/tool_calls, tool carries tool_results only. SYSTEM is never sent — the system prompt
// is kept once per run in agent_runs.prompt. finish_reason/model/call_id are LLM-call telemetry
// (populated at stage 1b; when empty, write them as nullable).
message SaveTurnRequest {
  string agent_id = 1;
  string run_id = 2;                   // agent_runs.id (= DBOS workflow id)
  int32 turn_index = 3;                // monotonic per-run counter; idempotency key is (run_id, turn_index)
  TurnRole role = 4;
  string text = 5;
  reserved 6;                          // was `bool thinking` — derived from thinking_text, never read
  repeated ToolCallRec tool_calls = 7;      // on an assistant turn
  repeated ToolResultRec tool_results = 8;  // on a tool turn
  string finish_reason = 9;            // 1b; empty = null
  string model = 10;                   // 1b; empty = null
  string call_id = 11;                 // 1b; links to llm_usage_log; empty = null
  // The turn's reasoning content, uncapped; empty = the model did not reason. Assistant turns only.
  // The channel's 💭 marker is driven by the same emptiness, so no separate flag travels.
  string thinking_text = 12;
}

message SaveTurnResponse {
  bool duplicate = 1;                  // (run_id, turn_index) already written — replay/retry
}

message SavePromptRequest {
  string agent_id = 1;
  string run_id = 2;                   // agent_runs.id (= DBOS workflow id)
  // JSON array of the worker's AgentChatMessage exactly as it went into the loop
  // (system+history+trigger). The backend stores it opaquely in JSONB — observability, not a
  // projection; attachments appear as references, not bytes.
  string prompt_json = 3;
}

message SavePromptResponse {
  bool stored = 1;                     // false = the snapshot already existed (first-write-wins)
}

// One assistant turn with tools: preamble + calls + results. The field schema mirrors the worker's
// AgentChatMessage (and the OpenAI/Spring AI wire format), minus the constant type="function".
message ToolTurn {
  string text = 1;                     // assistant text alongside the calls (may be empty)
  repeated ToolCallRec calls = 2;
  repeated ToolResultRec results = 3;
}

message ToolCallRec {
  string id = 1;                       // call id from the LLM response
  string name = 2;                     // the tool's LLM-facing name ({namespace}.{name})
  string arguments_json = 3;           // raw JSON arguments
}

message ToolResultRec {
  string id = 1;                       // = ToolCallRec.id
  string name = 2;
  string output_json = 3;              // raw JSON result (or {"error": ...} when failed)
  bool failed = 4;
}

// History — for RunContext.history. The backend has already picked the runs and the parts; the
// worker maps kind onto a role (INBOUND → user, everything else → assistant) and tool_turn onto a
// native assistant(tool_calls) + tool(results) pair.
message HistoryMessage {
  MessageKind kind = 1;
  string text = 2;
  // Structural record of a tool turn, delivered as two adjacent records: first with calls
  // (tool_use), then with results (tool_result) — the worker stitches them into a pair by order.
  // Empty — an ordinary text row.
  ToolTurn tool_turn = 3;
}
