syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "MessageLogProto";

// Единая запись событий диалога (протокол v2, этап 3): воркер — единственный писатель истории,
// доставка в каналы — проекция записи на бэке (роутинг по kind и снапшоту каналов маршрута).
// Идемпотентность — (run_id, seq): DBOS-шаги at-least-once, ретрай не даёт ни дубля в
// истории, ни повторной доставки (дедуп downstream по детерминированному message_id).
service MessageLog {
  rpc SaveMessage(SaveMessageRequest) returns (SaveMessageResponse);
  // Канонический full-fidelity ход рана (agent_run_turns): по одной записи на AgentChatMessage
  // воркера (assistant/tool), без капов. В отличие от SaveMessage — не durable-шаг: ход это
  // идемпотентная проекция уже-durable данных (результатов дочерних LLM/tool-воркфлоу), поэтому
  // реплей переотправляет ту же пару (run_id, turn_index), а бэк дедуплицирует. Доставки нет.
  rpc SaveTurn(SaveTurnRequest) returns (SaveTurnResponse);
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_INBOUND = 1;   // ack «агент получил»: text пуст, канонику бэк берёт сам из trigger_log
  MESSAGE_KIND_PROGRESS = 2;  // промежуточный вывод (thinking/tool/text), уточняется progress_type
  MESSAGE_KIND_ANSWER = 3;    // финальный ответ LLM; помечает все сообщения рана completed=true
  MESSAGE_KIND_ERROR = 4;     // user notice об ошибке рана
}

enum ProgressType {
  PROGRESS_TYPE_UNSPECIFIED = 0;
  PROGRESS_TYPE_THINKING = 1;
  PROGRESS_TYPE_TOOL_CALL = 2;    // ход с вызовами: tool_turn несёт только calls (результатов ещё нет)
  PROGRESS_TYPE_TEXT = 3;
  PROGRESS_TYPE_TOOL_RESULT = 4;  // результаты того же хода (пишутся после исполнения): tool_turn несёт только results, text пуст → в канал не доставляется
}

message SaveMessageRequest {
  string agent_id = 1;
  string run_id = 2;        // agent_runs.id (= DBOS workflow id)
  int32 seq = 3;                // монотонный счётчик рана (0 = inbound); ключ идемпотентности
  MessageKind kind = 4;
  ProgressType progress_type = 5;  // только для PROGRESS
  string text = 6;              // для INBOUND пуст
  // Структурная запись tool-хода (протокол v2.1), дробится на две строки (v2.1a): у
  // PROGRESS/TOOL_CALL — только calls (text = канальная 🔧-проекция, доставляется сразу до
  // исполнения), у PROGRESS/TOOL_RESULT — только results (text пуст, история-only). В историю
  // следующих ранов бэк отдаёт обе как нативную пару tool_use/tool_result. Старый бэк поле
  // игнорирует; легаси-строки с calls+results в одной записи воркер по-прежнему понимает.
  ToolTurn tool_turn = 7;
}

message SaveMessageResponse {
  bool duplicate = 1;           // (run_id, seq) уже записан — ретрай
}

enum TurnRole {
  TURN_ROLE_UNSPECIFIED = 0;
  TURN_ROLE_SYSTEM = 1;
  TURN_ROLE_USER = 2;
  TURN_ROLE_ASSISTANT = 3;
  TURN_ROLE_TOOL = 4;
}

// Один ход канонического журнала. Схема повторяет AgentChatMessage воркера: assistant несёт
// text/thinking/tool_calls, tool — только tool_results. finish_reason/model/call_id — телеметрия
// LLM-вызова (заполняется на этапе 1b; пусты — писать nullable).
message SaveTurnRequest {
  string agent_id = 1;
  string run_id = 2;                   // agent_runs.id (= DBOS workflow id)
  int32 turn_index = 3;                // монотонный per-run счётчик; ключ идемпотентности (run_id, turn_index)
  TurnRole role = 4;
  string text = 5;
  bool thinking = 6;
  repeated ToolCallRec tool_calls = 7;      // у assistant-хода
  repeated ToolResultRec tool_results = 8;  // у tool-хода
  string finish_reason = 9;            // 1b; пусто = null
  string model = 10;                   // 1b; пусто = null
  string call_id = 11;                 // 1b; связь с llm_usage_log; пусто = null
}

message SaveTurnResponse {
  bool duplicate = 1;                  // (run_id, turn_index) уже записан — реплей/ретрай
}

// Один ход ассистента с тулами: преамбула + вызовы + результаты. Схема полей повторяет
// AgentChatMessage воркера (и wire-формат OpenAI/Spring AI), без константы type="function".
message ToolTurn {
  string text = 1;                     // текст ассистента рядом с вызовами (может быть пуст)
  repeated ToolCallRec calls = 2;
  repeated ToolResultRec results = 3;
}

message ToolCallRec {
  string id = 1;                       // id вызова из LLM-ответа
  string name = 2;                     // LLM-имя тула ({namespace}.{name})
  string arguments_json = 3;           // сырые JSON-аргументы
}

message ToolResultRec {
  string id = 1;                       // = ToolCallRec.id
  string name = 2;
  string output_json = 3;              // сырой JSON результата (или {"error": ...} при failed)
  bool failed = 4;
}

// История «как видел пользователь» — для RunContext.history. Бэк уже отфильтровал по
// completed=true и historyDetail; воркер маппит kind на роль (INBOUND → user, остальные →
// assistant), а tool_turn — на нативную пару assistant(tool_calls) + tool(results).
message HistoryMessage {
  MessageKind kind = 1;
  string text = 2;
  // Структурная запись tool-хода. У новых ранов приходит двумя соседними записями: сначала с
  // calls (tool_use), затем с results (tool_result) — воcker сшивает их в пару по порядку.
  // Легаси-раны шлют одну запись с calls+results. Пустая — обычная текстовая строка.
  ToolTurn tool_turn = 3;
}
