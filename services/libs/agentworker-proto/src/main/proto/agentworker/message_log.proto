syntax = "proto3";

package ru.agimate.agentworker;

option java_multiple_files = true;
option java_package = "ru.agimate.agentworker";
option java_outer_classname = "MessageLogProto";

// Единая запись событий диалога (протокол v2, этап 3): воркер — единственный писатель истории,
// доставка в каналы — проекция записи на бэке (роутинг по kind и снапшоту каналов маршрута).
// Идемпотентность — (run_id, seq): DBOS-шаги at-least-once, ретрай не даёт ни дубля в
// истории, ни повторной доставки (дедуп downstream по детерминированному message_id).
service MessageLog {
  rpc SaveMessage(SaveMessageRequest) returns (SaveMessageResponse);
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_INBOUND = 1;   // ack «агент получил»: text пуст, канонику бэк берёт сам из trigger_log
  MESSAGE_KIND_PROGRESS = 2;  // промежуточный вывод (thinking/tool/text), уточняется progress_type
  MESSAGE_KIND_ANSWER = 3;    // финальный ответ LLM; помечает все сообщения рана completed=true
  MESSAGE_KIND_ERROR = 4;     // user notice об ошибке рана
}

enum ProgressType {
  PROGRESS_TYPE_UNSPECIFIED = 0;
  PROGRESS_TYPE_THINKING = 1;
  PROGRESS_TYPE_TOOL_CALL = 2;
  PROGRESS_TYPE_TEXT = 3;
}

message SaveMessageRequest {
  string agent_id = 1;
  string run_id = 2;        // trigger_log_agents.id (= DBOS workflow id)
  int32 seq = 3;                // монотонный счётчик рана (0 = inbound); ключ идемпотентности
  MessageKind kind = 4;
  ProgressType progress_type = 5;  // только для PROGRESS
  string text = 6;              // для INBOUND пуст
  // Структурная запись tool-хода (протокол v2.1) — только для PROGRESS/TOOL_CALL. text при этом
  // остаётся канальной 🔧-проекцией; в историю следующих ранов бэк отдаёт tool_turn (нативные
  // tool_use/tool_result вместо имитируемого текста). Старый бэк поле игнорирует.
  ToolTurn tool_turn = 7;
}

message SaveMessageResponse {
  bool duplicate = 1;           // (run_id, seq) уже записан — ретрай
}

// Один ход ассистента с тулами: преамбула + вызовы + результаты. Схема полей повторяет
// AgentChatMessage воркера (и wire-формат OpenAI/Spring AI), без константы type="function".
message ToolTurn {
  string text = 1;                     // текст ассистента рядом с вызовами (может быть пуст)
  repeated ToolCallRec calls = 2;
  repeated ToolResultRec results = 3;
}

message ToolCallRec {
  string id = 1;                       // id вызова из LLM-ответа
  string name = 2;                     // LLM-имя тула ({namespace}.{name})
  string arguments_json = 3;           // сырые JSON-аргументы
}

message ToolResultRec {
  string id = 1;                       // = ToolCallRec.id
  string name = 2;
  string output_json = 3;              // сырой JSON результата (или {"error": ...} при failed)
  bool failed = 4;
}

// История «как видел пользователь» — для RunContext.history. Бэк уже отфильтровал по
// completed=true и historyDetail; воркер маппит kind на роль (INBOUND → user, остальные →
// assistant), а tool_turn — на нативную пару assistant(tool_calls) + tool(results).
message HistoryMessage {
  MessageKind kind = 1;
  string text = 2;
  ToolTurn tool_turn = 3;       // только у PROGRESS/TOOL_CALL с сохранённой структурной записью
}
